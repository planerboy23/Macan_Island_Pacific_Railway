<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACAN PACIFIC RAILWAY COMPANY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-image: url('https://cdnb.artstation.com/p/assets/images/images/024/461/063/large/felicien-nourry-roadbeach07.jpg?1582503487');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #d1d5db;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 6px;
            gap: 6px;
        }

        header {
            height: 42px;
            background: rgba(17, 21, 28, 0.95);
            backdrop-filter: blur(4px);
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .round-badge {
            background: #182232;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid #2563eb55;
        }

        .controls {
            display: flex;
            gap: 4px;
        }

        button {
            background: #1e3a8a;
            color: #e2e8f0;
            border: 1px solid #3b82f6aa;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; border-color: #60a5fa; }
        button.btn-next { background: #065f46; border-color: #10b981aa; color: #ecfdf5; }
        button.btn-next:hover { background: #047857; }
        button.btn-reset { background: #1f2937; border-color: #4b5563; }
        button.btn-reset:hover { background: #374151; }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .status-msg {
            color: #9ca3af;
            font-size: 0.85rem;
            text-align: center;
            padding: 20px;
        }

        .ereignis-karte {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 560px;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(56, 189, 248, 0.03);
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        .karte-header {
            text-align: center;
            padding-bottom: 4px;
            border-bottom: 1px solid #1e293b;
        }

        .karte-title {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .karte-sub {
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .task-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .task-item {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #1f2937;
            border-left: 3px solid #38bdf8;
            border-radius: 5px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-item.eskalation {
            border-left-color: #ef4444;
            background: rgba(26, 17, 20, 0.85);
        }

        .task-item.hidden-task {
            background: rgba(11, 15, 23, 0.8);
            border: 1px dashed #374151;
            border-left: 3px solid #6b7280;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }

        .task-item.hidden-task:hover {
            border-color: #38bdf8;
            background: rgba(17, 24, 39, 0.9);
        }

        .hidden-task-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: bold;
        }

        .q-icon {
            flex-shrink: 0;
        }

        .grunge-cyan-white {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            letter-spacing: 0.6px;
            color: #38bdf8;
        }

        .cargo-badge {
            display: block;
            width: 100%;
            text-align: center;
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            color: #fbbf24;
            background: rgba(120, 53, 15, 0.25);
            border: 1px solid #78350f88;
            border-radius: 5px;
            padding: 4px 6px;
        }

        .loc-block {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #1f2937;
            border-left: 3px solid #38bdf8;
            border-radius: 5px;
            padding: 7px 9px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .loc-block.demand {
            animation: pulse-red-cyan 9s ease-in-out infinite;
        }

        .loc-person-img {
            flex-shrink: 0;
            width: 62px;
            height: 62px;
            border-radius: 7px;
            border: 2px solid #ffffff;
            background-color: #0b0f17;
            background-repeat: no-repeat;
            /* Sanfter CSS-Default als Fallback, bevor JS die genaue Bildgröße kennt */
            background-size: 115%;
            background-position: center 20%;
            transition: background-size 0.3s ease, background-position 0.3s ease;
        }

        .loc-person-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06) !important;
            border-style: dashed;
        }

        .loc-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        @keyframes pulse-red-cyan {
            0%, 60%, 100% { border-left-color: #f87171; }
            85% { border-left-color: #38bdf8; }
        }

        .loc-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
        }

        .loc-name {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .loc-block.demand .loc-name {
            animation: pulse-red-cyan-text 9s ease-in-out infinite;
        }

        @keyframes pulse-red-cyan-text {
            0%, 60%, 100% { color: #fca5a5; }
            85% { color: #7dd3fc; }
        }

        .loc-reason {
            font-size: 0.72rem;
            font-style: italic;
            color: #9ca3af;
        }

        .connector {
            text-align: center;
            font-size: 0.85rem;
            color: #4b5563;
            line-height: 1;
            margin: -2px 0;
        }

        .flavor-box {
            font-size: 0.68rem;
            font-style: italic;
            color: #9ca3af;
            background: rgba(0,0,0,0.3);
            padding: 3px 5px;
            border-radius: 3px;
        }

        .flavor-box.warning {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            font-weight: 600;
        }

        .task-actions {
            display: flex;
            gap: 5px;
            margin-top: 2px;
        }

        .btn-task {
            flex: 1;
            padding: 4px;
            font-size: 0.7rem;
            border-radius: 3px;
        }

        .btn-done { background: #065f46; border-color: #10b981aa; color: #ecfdf5; }
        .btn-done:hover { background: #047857; }

        .btn-ignore { background: #374151; border-color: #4b5563; color: #d1d5db; }
        .btn-ignore:hover { background: #4b5563; }

        footer {
            height: 70px;
            background: rgba(17, 21, 28, 0.95);
            backdrop-filter: blur(4px);
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 5px 8px;
            display: flex;
            gap: 8px;
            font-size: 0.68rem;
            flex-shrink: 0;
        }

        .log-box {
            flex: 2;
            overflow-y: auto;
            background: rgba(8, 12, 16, 0.8);
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #161e2e;
            font-family: monospace;
            user-select: text;
        }

        .chain-box {
            flex: 1;
            background: rgba(8, 12, 16, 0.8);
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #161e2e;
            color: #9ca3af;
            user-select: text;
            overflow-y: auto;
        }

        .log-item { margin-bottom: 2px; color: #9ca3af; }
        .log-item span { color: #38bdf8; }
        .log-item.warn { color: #f87171; }

        /* --- Ablehnungs-Glitch-Overlay (Far-Cry-3-Stil) --- */
        #reject-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 10, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #reject-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .glitch-stack {
            position: relative;
            display: inline-block;
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            text-align: center;
            animation: glitchFlicker 0.5s steps(2) infinite;
        }

        @keyframes glitchFlicker {
            0%, 100% { opacity: 1; }
            42% { opacity: 0.78; }
            48% { opacity: 1; }
            70% { opacity: 0.55; }
            74% { opacity: 1; }
        }

        .glitch-layer {
            letter-spacing: 5px;
            white-space: nowrap;
            font-size: 3.2rem;
        }

        .glitch-layer.main {
            position: relative;
            color: #ffffff;
        }

        .glitch-layer.mirror-x {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: #38bdf8;
            opacity: 0.25;
            transform: scaleX(-1);
        }

        .glitch-layer.mirror-y {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: #7dd3fc;
            opacity: 0.18;
            transform: scaleY(-1);
        }

        .glitch-layer.ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: #38bdf8;
            opacity: 0.35;
            transform: translate(4px, -3px) skewX(-5deg);
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(-55px);
            transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.15), opacity 0.28s ease;
        }

        .letter.settle {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Personen-Reaktions-Popup (erfüllt / abgelehnt) --- */
        #person-popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 6vw, 40px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        #person-popup-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        #person-popup-overlay.success {
            background: radial-gradient(circle at 50% 38%, rgba(16, 185, 129, 0.35), rgba(2, 6, 10, 0.94) 70%);
        }

        #person-popup-overlay.fail {
            background: radial-gradient(circle at 50% 38%, rgba(190, 18, 18, 0.4), rgba(2, 6, 10, 0.96) 70%);
            animation: fail-screen-flash 0.5s ease-out;
        }

        @keyframes fail-screen-flash {
            0% { background-color: rgba(239, 68, 68, 0.85); }
            100% { background-color: transparent; }
        }

        .person-popup-card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            transform: scale(0.7);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.22, 1.1, 0.3, 1.35), opacity 0.3s ease;
        }

        #person-popup-overlay.active .person-popup-card {
            transform: scale(1);
            opacity: 1;
        }

        #person-popup-overlay.fail.active .person-popup-card {
            animation: fail-shake 0.42s ease-in-out 0.05s 3;
        }

        @keyframes fail-shake {
            0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
            25% { transform: translateX(-8px) rotate(-1.6deg) scale(1); }
            75% { transform: translateX(8px) rotate(1.6deg) scale(1); }
        }

        .person-popup-stamp {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: clamp(1.5rem, 7vw, 2.3rem);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 3px 20px;
            border-radius: 4px;
            transform: rotate(-4deg);
        }

        #person-popup-overlay.success .person-popup-stamp {
            color: #052e1d;
            background: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.75);
            animation: stamp-pop-success 0.9s cubic-bezier(0.22, 1.1, 0.3, 1.4);
        }

        #person-popup-overlay.fail .person-popup-stamp {
            color: #fff5f5;
            background: #b91c1c;
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.75);
        }

        @keyframes stamp-pop-success {
            0% { transform: rotate(-4deg) scale(2.4); opacity: 0; }
            60% { transform: rotate(-4deg) scale(0.92); opacity: 1; }
            100% { transform: rotate(-4deg) scale(1); opacity: 1; }
        }

        .person-popup-photo {
            position: relative;
            width: min(48vw, 190px);
            height: min(48vw, 190px);
            border-radius: 16px;
            overflow: hidden;
            background: #0b0f17;
        }

        .person-popup-photo::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .person-popup-img,
        .person-popup-placeholder {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
        }

        .person-popup-img {
            object-fit: cover;
            object-position: center 18%;
            display: none;
            transition: transform 0.3s ease, object-position 0.3s ease;
        }

        .person-popup-placeholder {
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
        }

        #person-popup-overlay.success .person-popup-photo {
            box-shadow: 0 0 0 4px #34d399, 0 0 55px 8px rgba(52, 211, 153, 0.6), 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: photo-glow-success 1.1s ease-in-out infinite;
        }

        #person-popup-overlay.fail .person-popup-photo {
            box-shadow: 0 0 0 4px #f87171, 0 0 55px 8px rgba(248, 113, 113, 0.55), 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        @keyframes photo-glow-success {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.22); }
        }

        .person-popup-confetti {
            position: absolute;
            inset: -30px;
            pointer-events: none;
        }

        .person-popup-confetti span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            border-radius: 2px;
            background: #34d399;
            opacity: 0;
        }

        #person-popup-overlay.success.active .person-popup-confetti span {
            animation: confetti-burst 0.9s ease-out forwards;
        }

        .person-popup-confetti span:nth-child(1)  { background:#34d399; --r: 0deg;   animation-delay: 0.05s; }
        .person-popup-confetti span:nth-child(2)  { background:#fbbf24; --r: 30deg;  animation-delay: 0.09s; }
        .person-popup-confetti span:nth-child(3)  { background:#38bdf8; --r: 60deg;  animation-delay: 0.02s; }
        .person-popup-confetti span:nth-child(4)  { background:#34d399; --r: 90deg;  animation-delay: 0.12s; }
        .person-popup-confetti span:nth-child(5)  { background:#fbbf24; --r: 120deg; animation-delay: 0.06s; }
        .person-popup-confetti span:nth-child(6)  { background:#38bdf8; --r: 150deg; animation-delay: 0.1s;  }
        .person-popup-confetti span:nth-child(7)  { background:#34d399; --r: 180deg; animation-delay: 0.04s; }
        .person-popup-confetti span:nth-child(8)  { background:#fbbf24; --r: 210deg; animation-delay: 0.13s; }
        .person-popup-confetti span:nth-child(9)  { background:#38bdf8; --r: 240deg; animation-delay: 0.07s; }
        .person-popup-confetti span:nth-child(10) { background:#34d399; --r: 270deg; animation-delay: 0.01s; }
        .person-popup-confetti span:nth-child(11) { background:#fbbf24; --r: 300deg; animation-delay: 0.11s; }
        .person-popup-confetti span:nth-child(12) { background:#38bdf8; --r: 330deg; animation-delay: 0.08s; }

        @keyframes confetti-burst {
            0%   { opacity: 1; transform: rotate(var(--r, 0deg)) translate(0, 0) scale(1); }
            100% { opacity: 0; transform: rotate(var(--r, 0deg)) translate(120px, -10px) scale(0.4); }
        }

        .person-popup-name {
            font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
            font-size: clamp(1.1rem, 5.5vw, 1.5rem);
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .person-popup-quote {
            font-size: clamp(0.85rem, 4.2vw, 1.05rem);
            line-height: 1.45;
            color: #f3f4f6;
            font-style: italic;
            padding: 0 6px;
            max-width: 34ch;
        }

        #person-popup-overlay.fail .person-popup-quote {
            color: #fecaca;
        }
    </style>
</head>
<body>

<header>
    <h1>MACAN PACIFIC RAILWAY COMPANY</h1>
    <div class="round-badge" id="round-display">Session: 1</div>
    <div class="controls">
        <button class="btn-reset" onclick="manualReset()">Reset</button>
        <button class="btn-next" onclick="nextRound()">Nächste Session</button>
    </div>
</header>

<main>
    <div class="ereignis-karte">
        <div class="karte-header">
            <div class="karte-title">Transport-Aufträge</div>
            <div class="karte-sub">Aktuelle Zugfahrten dieser Session</div>
        </div>
        <div class="task-list" id="task-container">
            <div class="status-msg">Lade Daten aus Google Sheets...</div>
        </div>
    </div>
</main>

<footer>
    <div class="log-box" id="log-list"></div>
    <div class="chain-box" id="chain-status"><b>Ketten-Status:</b> keine</div>
</footer>

<div id="reject-overlay" aria-hidden="true">
    <div class="glitch-stack" id="glitch-stack"></div>
</div>

<div id="person-popup-overlay" aria-hidden="true">
    <div class="person-popup-card" id="person-popup-card">
        <div class="person-popup-stamp" id="person-popup-stamp"></div>
        <div class="person-popup-photo" id="person-popup-photo">
            <img class="person-popup-img" id="person-popup-img" src="" alt="">
            <div class="person-popup-placeholder" id="person-popup-placeholder">
                <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="3.6"></circle>
                    <path d="M4.5 20.5c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5"></path>
                </svg>
            </div>
            <div class="person-popup-confetti" id="person-popup-confetti">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
        <div class="person-popup-name" id="person-popup-name"></div>
        <div class="person-popup-quote" id="person-popup-quote"></div>
    </div>
</div>

<script>
const SPREADSHEET_ID = '1CMCkSYRCetDYJWM9wP5QZE6kuPRrWxegoZ1kbCAp4rw';
const SAVE_KEY = 'macan_pacific_engine_v1';

let quellenList = [];
let zieleList = [];
let stateDefs = [];
let productionList = [];
let worldFlowList = [];
let systemConfig = {};
let abgelehntWords = [];
let personsList = [];
let personsByOrt = {};
let ueberallPersons = [];
let lastPersonByOrt = {};
let personZoomCache = {};

let world = null;
let datasetSignature = '';
let simulationReady = false;
let popupBusy = false;

const REQUIRED_COLUMNS = {
    Quellen: ['ID','Rohstoff','Quelle','Quelle Detail','Quelle Grund','Trigger-Typ','Gewicht','Menge (Waggons)','Cooldown (Sessions)','Start-Offset (Session)','Bedingung','QuelleffekteProWaggon','VerfallseffekteProWaggon','Aktiv-Dauer (Sessions)','Auswahlgruppe','Ziel-IDs','Flavor-Text'],
    Ziele: ['ID','Rohstoff','Ziel','Ziel Detail','Ziel Grund','Gewicht','Bedingung','Notfallbedingung','LieferwirkungProWaggon','Zielgruppe','Quelle-IDs','Flavor-Text'],
    ZUSTAENDE: ['ID','Ort','Typ','StartMin','StartMax','Min','Max','DriftProSession','Grenzmodus','Anzeige','Beschreibung'],
    PRODUKTION: ['ID','Ort','Prioritaet','Intervall','Start-Offset','Bedingung','Effekte','MaxProSession','Flavor'],
    WELTFLUESSE: ['ID','Intervall','Start-Offset','Bedingung','Effekte','ReferenzID','Flavor'],
    SYSTEM: ['Parameter','Wert']
};

function normalizeKey(k) {
    return String(k || '').trim().toLowerCase().replace(/[\s_\-]+/g, '');
}

function getField(raw, ...candidates) {
    if (!raw) return '';
    const keys = Object.keys(raw);
    for (const cand of candidates) {
        const n = normalizeKey(cand);
        const hit = keys.find(k => normalizeKey(k) === n);
        if (hit !== undefined) return raw[hit];
    }
    return '';
}

function cleanCell(v) {
    const s = String(v ?? '').trim();
    return s === '-' ? '' : s;
}

function fetchSheetJSONP(sheetName) {
    return new Promise((resolve, reject) => {
        const cbName = 'gviz_cb_' + Math.floor(Math.random() * 1000000000);
        const script = document.createElement('script');
        let settled = false;
        const cleanup = () => {
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
        };
        const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            cleanup();
            reject(new Error(`Zeitüberschreitung beim Laden von Blatt „${sheetName}“`));
        }, 12000);

        window[cbName] = data => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (!data || data.status === 'error' || !data.table) {
                reject(new Error(`Blatt „${sheetName}“ konnte nicht gelesen werden.`));
                return;
            }
            resolve(parseGvizTable(data.table));
        };

        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${cbName}&_cb=${Date.now()}`;
        script.onerror = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            reject(new Error(`Netzwerkfehler beim Laden von „${sheetName}“`));
        };
        document.head.appendChild(script);
    });
}

function parseGvizTable(table) {
    if (!table || !Array.isArray(table.rows)) return [];
    let headers = (table.cols || []).map(c => c ? String(c.label || '').trim() : '');
    let startRowIndex = 0;
    const headerSignals = new Set(['ID', 'ROHSTOFF', 'PARAMETER']);
    const labelsLookUsable = headers.some(h => headerSignals.has(String(h || '').trim().toUpperCase()));
    if (!labelsLookUsable && table.rows.length > 0) {
        headers = (table.rows[0].c || []).map(cell => cell ? String(cell.v ?? cell.f ?? '').trim() : '');
        startRowIndex = 1;
    }
    const rows = [];
    for (let i = startRowIndex; i < table.rows.length; i++) {
        const cells = table.rows[i]?.c || [];
        const obj = {};
        let hasData = false;
        headers.forEach((header, idx) => {
            if (!header) return;
            const cell = cells[idx];
            let value = '';
            if (cell) {
                // Rohwert vor formatiertem Anzeigewert verwenden, damit z. B. 1.5 nicht
                // durch eine lokale Tabellenformatierung zu "1,5" wird.
                if (cell.v !== undefined && cell.v !== null) value = String(cell.v).trim();
                else if (cell.f !== undefined && cell.f !== null) value = String(cell.f).trim();
            }
            obj[header] = value;
            if (value !== '') hasData = true;
        });
        if (hasData) rows.push(obj);
    }
    return rows;
}

function assertColumns(sheetName, rows) {
    if (!rows.length) throw new Error(`Blatt „${sheetName}“ ist leer.`);
    const keys = Object.keys(rows[0]).map(k => String(k).trim());
    const present = new Set(keys);
    const missing = REQUIRED_COLUMNS[sheetName].filter(k => !present.has(k));
    if (missing.length) throw new Error(`Blatt „${sheetName}“: fehlende Spalten: ${missing.join(', ')}`);
}

function parseInteger(value, label, { min = null, max = null } = {}) {
    const s = cleanCell(value);
    if (!/^-?\d+$/.test(s)) throw new Error(`${label}: ganzzahligen Wert erwartet, erhalten „${value}“`);
    const n = Number(s);
    if (!Number.isSafeInteger(n)) throw new Error(`${label}: Zahl außerhalb des gültigen Bereichs.`);
    if (min !== null && n < min) throw new Error(`${label}: muss mindestens ${min} sein.`);
    if (max !== null && n > max) throw new Error(`${label}: darf höchstens ${max} sein.`);
    return n;
}

function parseNumber(value, label) {
    const s = cleanCell(value);
    if (!/^-?(?:\d+\.?\d*|\.\d+)$/.test(s)) throw new Error(`${label}: Zahl erwartet, erhalten „${value}“`);
    const n = Number(s);
    if (!Number.isFinite(n)) throw new Error(`${label}: ungültige Zahl.`);
    return n;
}

function parseIdList(value, label = 'ID-Liste') {
    const s = cleanCell(value);
    if (!s) return [];
    const ids = s.split(',').map(v => v.trim().toUpperCase()).filter(Boolean);
    const seen = new Set();
    ids.forEach(id => {
        if (seen.has(id)) throw new Error(`${label}: doppelte Referenz ${id}.`);
        seen.add(id);
    });
    return ids;
}

function assertUniqueIds(rows, sheetName) {
    const seen = new Set();
    rows.forEach((r, idx) => {
        const id = String(getField(r, 'ID') || '').trim().toUpperCase();
        if (!id) throw new Error(`${sheetName}, Zeile ${idx + 2}: ID fehlt.`);
        if (seen.has(id)) throw new Error(`${sheetName}: doppelte ID ${id}.`);
        seen.add(id);
    });
}

function assertExpectedIdRange(rows, prefix, first, last, sheetName) {
    const actual = new Set(rows.map(r => String(getField(r, 'ID') || '').trim().toUpperCase()));
    const expected = [];
    for (let i = first; i <= last; i++) expected.push(`${prefix}${i}`);
    const missing = expected.filter(id => !actual.has(id));
    const unexpected = [...actual].filter(id => !expected.includes(id));
    if (missing.length || unexpected.length) {
        const parts = [];
        if (missing.length) parts.push(`fehlend: ${missing.join(', ')}`);
        if (unexpected.length) parts.push(`unerwartet: ${unexpected.join(', ')}`);
        throw new Error(`${sheetName}: ID-Satz entspricht nicht Schema 1 (${parts.join('; ')}).`);
    }
}

function parseCondition(expression, knownStateIds) {
    const raw = cleanCell(expression);
    if (!raw) return { raw: '', groups: [] };
    if (/[()]/.test(raw)) throw new Error(`Bedingung „${raw}“: Klammern sind nicht erlaubt.`);
    const orParts = raw.split('|');
    if (orParts.some(p => !p.trim())) throw new Error(`Bedingung „${raw}“: leerer ODER-Teil.`);
    const groups = orParts.map(orPart => {
        const andParts = orPart.split('&');
        if (andParts.some(p => !p.trim())) throw new Error(`Bedingung „${raw}“: leerer UND-Teil.`);
        return andParts.map(token => {
            const m = token.trim().match(/^([A-Z0-9_]+)\s*(<=|>=|!=|=|<|>)\s*(-?(?:\d+\.?\d*|\.\d+))$/i);
            if (!m) throw new Error(`Ungültiger Vergleich „${token.trim()}“ in Bedingung „${raw}“.`);
            const stateId = m[1].toUpperCase();
            if (!knownStateIds.has(stateId)) throw new Error(`Bedingung „${raw}“ verweist auf unbekannten Zustand ${stateId}.`);
            return { stateId, op: m[2], value: Number(m[3]) };
        });
    });
    return { raw, groups };
}

function conditionTrue(cond, values) {
    if (!cond || !cond.groups || cond.groups.length === 0) return true;
    const cmp = (left, op, right) => {
        if (op === '<') return left < right;
        if (op === '<=') return left <= right;
        if (op === '=') return left === right;
        if (op === '!=') return left !== right;
        if (op === '>=') return left >= right;
        if (op === '>') return left > right;
        return false;
    };
    return cond.groups.some(group => group.every(c => cmp(Number(values[c.stateId]), c.op, c.value)));
}

function parseEffects(expression, knownStateIds) {
    const raw = cleanCell(expression);
    if (!raw) return {};
    const out = {};
    raw.split(';').forEach(token => {
        const t = token.trim();
        if (!t) throw new Error(`Effekt „${raw}“ enthält einen leeren Teil.`);
        const m = t.match(/^([A-Z0-9_]+)\s*([+-])\s*((?:\d+\.?\d*|\.\d+))$/i);
        if (!m) throw new Error(`Ungültiger Effekt „${t}“ in „${raw}“.`);
        const stateId = m[1].toUpperCase();
        if (!knownStateIds.has(stateId)) throw new Error(`Effekt „${raw}“ verweist auf unbekannten Zustand ${stateId}.`);
        const amount = Number(m[3]) * (m[2] === '-' ? -1 : 1);
        out[stateId] = (out[stateId] || 0) + amount;
    });
    return out;
}

function mergeEffects(...effectsList) {
    const out = {};
    effectsList.forEach(effects => {
        Object.entries(effects || {}).forEach(([id, value]) => {
            out[id] = (out[id] || 0) + Number(value || 0);
        });
    });
    Object.keys(out).forEach(id => {
        if (Math.abs(out[id]) < 1e-12) delete out[id];
    });
    return out;
}

function scaleEffects(effects, factor) {
    const out = {};
    Object.entries(effects || {}).forEach(([id, value]) => out[id] = value * factor);
    return out;
}

function normalizeData(rawSheets) {
    Object.entries(REQUIRED_COLUMNS).forEach(([name]) => assertColumns(name, rawSheets[name]));
    assertUniqueIds(rawSheets.Quellen, 'Quellen');
    assertUniqueIds(rawSheets.Ziele, 'Ziele');
    assertUniqueIds(rawSheets.ZUSTAENDE, 'ZUSTAENDE');
    assertUniqueIds(rawSheets.PRODUKTION, 'PRODUKTION');
    assertUniqueIds(rawSheets.WELTFLUESSE, 'WELTFLUESSE');
    assertExpectedIdRange(rawSheets.Quellen, 'Q', 1, 30, 'Quellen');
    assertExpectedIdRange(rawSheets.Ziele, 'Z', 1, 38, 'Ziele');

    stateDefs = rawSheets.ZUSTAENDE.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const startMin = parseInteger(getField(r,'StartMin'), `${id}.StartMin`);
        const startMax = parseInteger(getField(r,'StartMax'), `${id}.StartMax`);
        const min = parseNumber(getField(r,'Min'), `${id}.Min`);
        const max = parseNumber(getField(r,'Max'), `${id}.Max`);
        const drift = parseNumber(getField(r,'DriftProSession'), `${id}.DriftProSession`);
        const boundaryMode = cleanCell(getField(r,'Grenzmodus'));
        if (!['Strikt','Klemmen'].includes(boundaryMode)) throw new Error(`${id}: Grenzmodus muss Strikt oder Klemmen sein.`);
        if (startMin > startMax || min > max || startMin < min || startMax > max) throw new Error(`${id}: Start-/Grenzwerte sind widersprüchlich.`);
        return {
            id,
            ort: cleanCell(getField(r,'Ort')),
            typ: cleanCell(getField(r,'Typ')),
            startMin, startMax, min, max, drift,
            boundaryMode,
            display: cleanCell(getField(r,'Anzeige')).toLowerCase() === 'ja',
            description: cleanCell(getField(r,'Beschreibung'))
        };
    });

    const stateIds = new Set(stateDefs.map(s => s.id));

    quellenList = rawSheets.Quellen.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const triggerType = cleanCell(getField(r,'Trigger-Typ'));
        if (!['Regel','Zufall','Notfall','INTERN'].includes(triggerType)) throw new Error(`${id}: unbekannter Trigger-Typ „${triggerType}“.`);
        return {
            id,
            rohstoff: cleanCell(getField(r,'Rohstoff')),
            ort: cleanCell(getField(r,'Quelle')),
            detail: cleanCell(getField(r,'Quelle Detail')),
            grund: cleanCell(getField(r,'Quelle Grund')),
            triggerType,
            gewicht: parseNumber(getField(r,'Gewicht'), `${id}.Gewicht`),
            menge: parseInteger(getField(r,'Menge (Waggons)'), `${id}.Menge`, { min: 0 }),
            cooldown: parseInteger(getField(r,'Cooldown (Sessions)'), `${id}.Cooldown`, { min: 0 }),
            startOffset: parseInteger(getField(r,'Start-Offset (Session)'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            sourceEffects: parseEffects(getField(r,'QuelleffekteProWaggon'), stateIds),
            expiryEffects: parseEffects(getField(r,'VerfallseffekteProWaggon'), stateIds),
            activeDuration: parseInteger(getField(r,'Aktiv-Dauer (Sessions)'), `${id}.Aktiv-Dauer`, { min: 0 }),
            selectionGroup: cleanCell(getField(r,'Auswahlgruppe')) || id,
            allowedTargetIds: parseIdList(getField(r,'Ziel-IDs'), `${id}.Ziel-IDs`),
            flavorText: cleanCell(getField(r,'Flavor-Text'))
        };
    });

    zieleList = rawSheets.Ziele.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        return {
            id,
            rohstoff: cleanCell(getField(r,'Rohstoff')),
            ort: cleanCell(getField(r,'Ziel')),
            detail: cleanCell(getField(r,'Ziel Detail')),
            grund: cleanCell(getField(r,'Ziel Grund')),
            gewicht: parseNumber(getField(r,'Gewicht'), `${id}.Gewicht`),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            emergencyCondition: parseCondition(getField(r,'Notfallbedingung'), stateIds),
            deliveryEffects: parseEffects(getField(r,'LieferwirkungProWaggon'), stateIds),
            targetGroup: cleanCell(getField(r,'Zielgruppe')) || id,
            allowedSourceIds: parseIdList(getField(r,'Quelle-IDs'), `${id}.Quelle-IDs`),
            flavorText: cleanCell(getField(r,'Flavor-Text'))
        };
    });

    const qById = Object.fromEntries(quellenList.map(q => [q.id, q]));
    const zById = Object.fromEntries(zieleList.map(z => [z.id, z]));

    quellenList.forEach(q => {
        if (q.gewicht < 0) throw new Error(`${q.id}: Gewicht darf nicht negativ sein.`);
        if (q.triggerType !== 'INTERN') {
            if (q.gewicht <= 0) throw new Error(`${q.id}: transportfähige Quelle braucht ein positives Gewicht.`);
            if (q.menge < 1) throw new Error(`${q.id}: transportfähige Quelle braucht mindestens 1 Waggon.`);
            if (q.activeDuration < 1) throw new Error(`${q.id}: transportfähige Quelle braucht eine Aktiv-Dauer von mindestens 1 Session.`);
            if (!q.allowedTargetIds.length) throw new Error(`${q.id}: transportfähige Quelle hat keine Ziel-IDs.`);
        }
        q.allowedTargetIds.forEach(zid => {
            const z = zById[zid];
            if (!z) throw new Error(`${q.id}: unbekannte Ziel-ID ${zid}.`);
            if (!z.allowedSourceIds.includes(q.id)) throw new Error(`${q.id} ↔ ${zid}: Verbindung ist nicht auf beiden Seiten eingetragen.`);
            if (q.rohstoff !== z.rohstoff) throw new Error(`${q.id} ↔ ${zid}: Rohstoff stimmt nicht überein (${q.rohstoff} / ${z.rohstoff}).`);
            if (q.triggerType === 'Notfall' && !z.emergencyCondition.raw) throw new Error(`${q.id} ↔ ${zid}: Notfallquelle benötigt am Ziel eine Notfallbedingung.`);
        });
    });
    zieleList.forEach(z => {
        if (z.gewicht <= 0) throw new Error(`${z.id}: Ziel braucht ein positives Gewicht.`);
        if (!z.allowedSourceIds.length) throw new Error(`${z.id}: Ziel hat keine Quelle-IDs.`);
        z.allowedSourceIds.forEach(qid => {
            const q = qById[qid];
            if (!q) throw new Error(`${z.id}: unbekannte Quelle-ID ${qid}.`);
            if (!q.allowedTargetIds.includes(z.id)) throw new Error(`${qid} ↔ ${z.id}: Verbindung ist nicht auf beiden Seiten eingetragen.`);
        });
    });

    const groupMap = {};
    quellenList.filter(q => q.triggerType !== 'INTERN').forEach(q => {
        const g = groupMap[q.selectionGroup] || (groupMap[q.selectionGroup] = []);
        g.push(q);
    });
    Object.entries(groupMap).forEach(([groupId, qs]) => {
        const cooldowns = new Set(qs.map(q => q.cooldown));
        const offsets = new Set(qs.map(q => q.startOffset));
        if (cooldowns.size > 1 || offsets.size > 1) throw new Error(`Auswahlgruppe ${groupId}: Varianten müssen denselben Cooldown und Start-Offset haben.`);
    });

    productionList = rawSheets.PRODUKTION.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        return {
            id,
            ort: cleanCell(getField(r,'Ort')),
            priority: parseInteger(getField(r,'Prioritaet'), `${id}.Prioritaet`),
            interval: parseInteger(getField(r,'Intervall'), `${id}.Intervall`, { min: 1 }),
            startOffset: parseInteger(getField(r,'Start-Offset'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            effects: parseEffects(getField(r,'Effekte'), stateIds),
            maxPerSession: parseInteger(getField(r,'MaxProSession'), `${id}.MaxProSession`, { min: 1 }),
            flavor: cleanCell(getField(r,'Flavor'))
        };
    });

    worldFlowList = rawSheets.WELTFLUESSE.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const referenceId = cleanCell(getField(r,'ReferenzID')).toUpperCase();
        if (referenceId && !qById[referenceId]) throw new Error(`${id}: ReferenzID ${referenceId} existiert nicht.`);
        return {
            id,
            interval: parseInteger(getField(r,'Intervall'), `${id}.Intervall`, { min: 1 }),
            startOffset: parseInteger(getField(r,'Start-Offset'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            effects: parseEffects(getField(r,'Effekte'), stateIds),
            referenceId,
            flavor: cleanCell(getField(r,'Flavor'))
        };
    });

    systemConfig = {};
    rawSheets.SYSTEM.forEach((r, idx) => {
        const parameter = cleanCell(getField(r,'Parameter'));
        // Hier NICHT cleanCell verwenden: LeeresFeld hat absichtlich den Literalwert "-".
        const value = String(getField(r,'Wert') ?? '').trim();
        if (!parameter) throw new Error(`SYSTEM Zeile ${idx + 2}: Parameter fehlt.`);
        if (!value) throw new Error(`SYSTEM.${parameter}: Wert fehlt.`);
        if (Object.prototype.hasOwnProperty.call(systemConfig, parameter)) throw new Error(`SYSTEM: doppelter Parameter ${parameter}.`);
        systemConfig[parameter] = value;
    });

    const requiredParams = [
        'SchemaVersion','MaxAktiveAuftraege','MaxNeueAuftraegeProSession','AgingProSession','OrtAgingProSession',
        'OrtsausgleichAbSessions','ZufallsbevorzugungAbSessions','ZufallsGewichtsfaktor','NotfallGewichtsfaktor','CooldownJitter',
        'Startzustand','Persistenz','OfflineFortschritt','PauseReset','Transportmenge','EffekteSkalierung','Auswahl',
        'MaxAktivProQGruppe','MaxAktivProZielgruppe','Bedingung_AND','Bedingung_OR','LeeresFeld','Ketten',
        'Produktionsreihenfolge','Weltflussreihenfolge','TimerNachFehlversuch','CooldownStart','Angebotsablauf','SessionAblauf'
    ];
    requiredParams.forEach(p => { if (!(p in systemConfig)) throw new Error(`SYSTEM: Parameter ${p} fehlt.`); });

    systemConfig.SchemaVersion = String(systemConfig.SchemaVersion).trim();
    if (systemConfig.SchemaVersion !== '1') throw new Error(`SYSTEM.SchemaVersion ${systemConfig.SchemaVersion} wird von dieser Engine nicht unterstützt.`);

    ['MaxAktiveAuftraege','MaxAktivProQGruppe','MaxAktivProZielgruppe'].forEach(p => systemConfig[p] = parseInteger(systemConfig[p], `SYSTEM.${p}`, { min: 1 }));
    ['MaxNeueAuftraegeProSession','AgingProSession','OrtAgingProSession','OrtsausgleichAbSessions','ZufallsbevorzugungAbSessions','CooldownJitter'].forEach(p => systemConfig[p] = parseInteger(systemConfig[p], `SYSTEM.${p}`, { min: 0 }));
    ['ZufallsGewichtsfaktor','NotfallGewichtsfaktor'].forEach(p => {
        systemConfig[p] = parseNumber(systemConfig[p], `SYSTEM.${p}`);
        if (systemConfig[p] <= 0) throw new Error(`SYSTEM.${p}: muss größer als 0 sein.`);
    });

    const requiredLiterals = {
        Startzustand: 'ZufallGanzzahlig',
        Persistenz: 'NachJederAktion',
        OfflineFortschritt: 'NEIN',
        PauseReset: 'NEIN',
        Transportmenge: 'NurQ',
        EffekteSkalierung: 'ProWaggon',
        Auswahl: 'QGruppeDannZielgruppeDannVariante',
        Bedingung_AND: '&',
        Bedingung_OR: '|',
        LeeresFeld: '-',
        Ketten: 'NichtInVersion1',
        Produktionsreihenfolge: 'PrioritaetDannID',
        Weltflussreihenfolge: 'ID',
        TimerNachFehlversuch: 'NaechsterIntervall',
        CooldownStart: 'BeiAngebot',
        Angebotsablauf: 'FreigabeUndVerfallseffekte',
        SessionAblauf: 'Verfall>Weltfluesse>Produktion>Drift>Auswahl'
    };
    Object.entries(requiredLiterals).forEach(([p, expected]) => {
        if (systemConfig[p] !== expected) throw new Error(`SYSTEM.${p}: "${systemConfig[p]}" wird in Schema 1 nicht unterstützt; erwartet "${expected}".`);
    });

    const q25 = qById.Q25;
    if (!q25 || q25.triggerType !== 'INTERN') throw new Error('Q25 muss als Referenzkarte mit Trigger-Typ INTERN vorhanden sein.');
    if (q25.menge !== 0 || q25.allowedTargetIds.length || Object.keys(q25.sourceEffects).length || Object.keys(q25.expiryEffects).length) {
        throw new Error('Q25 darf keine Transportmenge, Zielverbindungen oder Transport-/Verfallseffekte besitzen.');
    }
    const q25Refs = worldFlowList.filter(w => w.referenceId === 'Q25');
    if (q25Refs.length !== 1 || q25Refs[0].id !== 'PV_TANKER') throw new Error('Q25 darf genau einmal und ausschließlich von WELTFLUESSE.PV_TANKER referenziert werden.');

    return { qById, zById };
}

function stableHash(value) {
    const str = JSON.stringify(value);
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
}

function makeDatasetSignature() {
    return `${systemConfig.SchemaVersion}:${stableHash({quellenList, zieleList, stateDefs, productionList, worldFlowList, systemConfig})}`;
}

function randomIntInclusive(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function initialWorld() {
    const values = {};
    stateDefs.forEach(s => values[s.id] = randomIntInclusive(s.startMin, s.startMax));
    const groupTimers = {};
    const groupAging = {};
    const groups = new Map();
    quellenList.filter(q => q.triggerType !== 'INTERN').forEach(q => {
        if (!groups.has(q.selectionGroup)) groups.set(q.selectionGroup, q);
    });
    groups.forEach((q, groupId) => {
        groupTimers[groupId] = q.startOffset;
        groupAging[groupId] = 0;
    });
    const visitTimes = {};
    const places = new Set();
    quellenList.forEach(q => { if (q.ort) places.add(q.ort); });
    zieleList.forEach(z => { if (z.ort) places.add(z.ort); });
    places.forEach(place => visitTimes[place] = 0);
    return {
        schemaVersion: systemConfig.SchemaVersion,
        datasetSignature,
        session: 1,
        values,
        activeTasks: [],
        groupTimers,
        groupAging,
        visitTimes,
        lastRandomCreated: 0,
        nextTaskSerial: 1,
        createdAt: Date.now(),
        updatedAt: Date.now()
    };
}

function saveWorld() {
    if (!world) return;
    world.updatedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(world));
}

function loadWorldOrInitialize() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    let saved;
    try { saved = JSON.parse(raw); }
    catch (_) {
        const ok = confirm('Der gespeicherte Spielstand ist beschädigt. Kompletten Neustart durchführen?');
        if (!ok) return false;
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    if (saved.datasetSignature !== datasetSignature || saved.schemaVersion !== systemConfig.SchemaVersion) {
        const ok = confirm('Die Tabellen bzw. die Schema-Version haben sich seit dem gespeicherten Spielstand geändert. Alte aktive Aufträge dürfen nicht still mit neuen Effekten weiterlaufen. Kompletten Neustart mit den aktuellen Daten durchführen?');
        if (!ok) {
            showFatal('Datensatz geändert. Der alte Spielstand wurde nicht geladen. Bitte Tabellen zurücksetzen oder den bestätigten Neustart ausführen.');
            return false;
        }
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    world = saved;
    validateLoadedWorld();
    return true;
}

function numericMapsEqual(a, b) {
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for (const key of keys) {
        if (Math.abs(Number(a?.[key] || 0) - Number(b?.[key] || 0)) > 1e-9) return false;
    }
    return true;
}

function reservationsEqual(a, b) {
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for (const key of keys) {
        const ar = a?.[key] || { out: 0, in: 0 };
        const br = b?.[key] || { out: 0, in: 0 };
        if (Math.abs(Number(ar.out || 0) - Number(br.out || 0)) > 1e-9) return false;
        if (Math.abs(Number(ar.in || 0) - Number(br.in || 0)) > 1e-9) return false;
    }
    return true;
}

function expectedSelectionGroups() {
    return [...new Set(quellenList.filter(q => q.triggerType !== 'INTERN').map(q => q.selectionGroup))];
}

function expectedVisitPlaces() {
    return [...new Set([...quellenList.map(q => q.ort), ...zieleList.map(z => z.ort)].filter(Boolean))];
}

function validateLoadedWorld() {
    if (!world || typeof world !== 'object') throw new Error('Spielstand: ungültiges Wurzelobjekt.');
    if (!Number.isInteger(world.session) || world.session < 1) throw new Error('Spielstand: ungültige Sessionnummer.');
    if (!world.values || typeof world.values !== 'object' || Array.isArray(world.values)) throw new Error('Spielstand: Zustände fehlen.');

    const stateIds = new Set(stateDefs.map(s => s.id));
    stateDefs.forEach(s => {
        if (!Object.prototype.hasOwnProperty.call(world.values, s.id)) throw new Error(`Spielstand: Zustand ${s.id} fehlt.`);
        const value = Number(world.values[s.id]);
        if (!Number.isFinite(value)) throw new Error(`Spielstand: Zustand ${s.id} ist keine gültige Zahl.`);
        if (value < s.min - 1e-9 || value > s.max + 1e-9) throw new Error(`Spielstand: Zustand ${s.id} liegt außerhalb seiner Grenzen.`);
    });
    Object.keys(world.values).forEach(id => {
        if (!stateIds.has(id)) throw new Error(`Spielstand: unbekannter Zustand ${id}.`);
    });

    const groups = expectedSelectionGroups();
    const groupSet = new Set(groups);
    for (const field of ['groupTimers','groupAging']) {
        const obj = world[field];
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error(`Spielstand: ${field} fehlt.`);
        groups.forEach(groupId => {
            if (!Object.prototype.hasOwnProperty.call(obj, groupId)) throw new Error(`Spielstand: ${field}.${groupId} fehlt.`);
            const value = Number(obj[groupId]);
            if (!Number.isFinite(value) || value < 0) throw new Error(`Spielstand: ${field}.${groupId} ist ungültig.`);
            if (field === 'groupTimers' && !Number.isInteger(value)) throw new Error(`Spielstand: ${field}.${groupId} muss ganzzahlig sein.`);
        });
        Object.keys(obj).forEach(groupId => { if (!groupSet.has(groupId)) throw new Error(`Spielstand: unbekannte Q-Gruppe ${groupId} in ${field}.`); });
    }

    const places = expectedVisitPlaces();
    const placeSet = new Set(places);
    if (!world.visitTimes || typeof world.visitTimes !== 'object' || Array.isArray(world.visitTimes)) throw new Error('Spielstand: Besuchszeiten fehlen.');
    places.forEach(place => {
        if (!Object.prototype.hasOwnProperty.call(world.visitTimes, place)) throw new Error(`Spielstand: Besuchszeit für ${place} fehlt.`);
        const value = Number(world.visitTimes[place]);
        if (!Number.isInteger(value) || value < 0 || value > world.session) throw new Error(`Spielstand: Besuchszeit für ${place} ist ungültig.`);
    });
    Object.keys(world.visitTimes).forEach(place => { if (!placeSet.has(place)) throw new Error(`Spielstand: unbekannter Ort ${place} in Besuchszeiten.`); });

    if (!Number.isInteger(world.lastRandomCreated) || world.lastRandomCreated < 0 || world.lastRandomCreated > world.session) throw new Error('Spielstand: letzter Zufallszeitpunkt ist ungültig.');
    if (!Number.isInteger(world.nextTaskSerial) || world.nextTaskSerial < 1) throw new Error('Spielstand: nextTaskSerial ist ungültig.');
    if (!Array.isArray(world.activeTasks)) throw new Error('Spielstand: activeTasks fehlt.');

    const taskIds = new Set();
    const qGroupCounts = {};
    const zGroupCounts = {};
    world.activeTasks.forEach(t => {
        if (!t || typeof t !== 'object' || !t.id || taskIds.has(t.id)) throw new Error(`Spielstand: ungültige oder doppelte Auftrags-ID ${t?.id || '?'}.`);
        taskIds.add(t.id);
        const q = qById(t.qId);
        const z = zById(t.zId);
        if (!q || !z) throw new Error(`Spielstand: Auftrag ${t.id} verweist auf unbekannte Q/Z-ID.`);
        if (q.triggerType === 'INTERN' || !q.allowedTargetIds.includes(z.id) || !z.allowedSourceIds.includes(q.id) || q.rohstoff !== z.rohstoff) throw new Error(`Spielstand: Auftrag ${t.id} enthält keine gültige Q/Z-Verbindung.`);
        if (!Number.isInteger(t.createdSession) || t.createdSession < 1 || t.createdSession > world.session) throw new Error(`Spielstand: Auftrag ${t.id} hat eine ungültige Erzeugungs-Session.`);
        if (!Number.isInteger(t.activeDuration) || t.activeDuration < 1 || t.activeDuration !== q.activeDuration) throw new Error(`Spielstand: Auftrag ${t.id} hat eine ungültige Aktiv-Dauer.`);
        if (t.selectionGroup !== q.selectionGroup || t.targetGroup !== z.targetGroup || t.triggerType !== q.triggerType) throw new Error(`Spielstand: Auftrag ${t.id} enthält inkonsistente Gruppendaten.`);
        if (Number(t.menge) !== transportQuantity(q, z)) throw new Error(`Spielstand: Auftrag ${t.id} enthält eine inkonsistente Waggonzahl.`);
        const expected = buildPairSnapshot(q, z);
        if (!numericMapsEqual(t.fulfillmentEffects, expected.fulfillmentEffects) || !numericMapsEqual(t.expiryEffects, expected.expiryEffects) || !reservationsEqual(t.reservation, expected.reservation)) {
            throw new Error(`Spielstand: Auftrag ${t.id} enthält Effekte/Reservierungen, die nicht zum gespeicherten Datensatz passen.`);
        }
        qGroupCounts[t.selectionGroup] = (qGroupCounts[t.selectionGroup] || 0) + 1;
        zGroupCounts[t.targetGroup] = (zGroupCounts[t.targetGroup] || 0) + 1;
    });
    Object.entries(qGroupCounts).forEach(([groupId, count]) => {
        if (count > systemConfig.MaxAktivProQGruppe) throw new Error(`Spielstand: Q-Gruppe ${groupId} überschreitet MaxAktivProQGruppe.`);
    });
    Object.entries(zGroupCounts).forEach(([groupId, count]) => {
        if (count > systemConfig.MaxAktivProZielgruppe) throw new Error(`Spielstand: Zielgruppe ${groupId} überschreitet MaxAktivProZielgruppe.`);
    });
    if (world.activeTasks.length > systemConfig.MaxAktiveAuftraege) throw new Error('Spielstand: mehr aktive Aufträge als MaxAktiveAuftraege.');

    const reservations = totalReservations();
    stateDefs.filter(s => s.boundaryMode === 'Strikt').forEach(s => {
        const r = reservations[s.id] || { out: 0, in: 0 };
        const cur = Number(world.values[s.id]);
        if (cur - s.min < Number(r.out || 0) - 1e-9 || s.max - cur < Number(r.in || 0) - 1e-9) {
            throw new Error(`Spielstand: Reservierungen für ${s.id} sind mit dem aktuellen Zustand nicht erfüllbar.`);
        }
    });
}

function stateDef(id) {
    return stateDefs.find(s => s.id === id);
}

function totalReservations(excludeTaskId = null) {
    const totals = {};
    (world?.activeTasks || []).forEach(task => {
        if (excludeTaskId && task.id === excludeTaskId) return;
        Object.entries(task.reservation || {}).forEach(([stateId, r]) => {
            if (!totals[stateId]) totals[stateId] = { out: 0, in: 0 };
            totals[stateId].out += Number(r.out || 0);
            totals[stateId].in += Number(r.in || 0);
        });
    });
    return totals;
}

function reservationForAlternatives(fulfillmentEffects, expiryEffects) {
    const reservation = {};
    stateDefs.filter(s => s.boundaryMode === 'Strikt').forEach(s => {
        const f = Number(fulfillmentEffects[s.id] || 0);
        const e = Number(expiryEffects[s.id] || 0);
        const out = Math.max(Math.max(0, -f), Math.max(0, -e));
        const inn = Math.max(Math.max(0, f), Math.max(0, e));
        if (out > 0 || inn > 0) reservation[s.id] = { out, in: inn };
    });
    return reservation;
}

function canAddReservation(reservation) {
    const existing = totalReservations();
    for (const [stateId, r] of Object.entries(reservation || {})) {
        const def = stateDef(stateId);
        if (!def || def.boundaryMode !== 'Strikt') continue;
        const cur = Number(world.values[stateId]);
        const prev = existing[stateId] || { out: 0, in: 0 };
        if (cur - def.min - prev.out < Number(r.out || 0) - 1e-9) return false;
        if (def.max - cur - prev.in < Number(r.in || 0) - 1e-9) return false;
    }
    return true;
}

function canApplyTransaction(effects, excludeTaskId = null) {
    const reserved = totalReservations(excludeTaskId);
    for (const [stateId, delta] of Object.entries(effects || {})) {
        const def = stateDef(stateId);
        if (!def) return false;
        if (def.boundaryMode === 'Klemmen') continue;
        const next = Number(world.values[stateId]) + Number(delta);
        const r = reserved[stateId] || { out: 0, in: 0 };
        if (next < def.min - 1e-9 || next > def.max + 1e-9) return false;
        if (next - def.min < r.out - 1e-9) return false;
        if (def.max - next < r.in - 1e-9) return false;
    }
    return true;
}

function applyTransaction(effects, { excludeTaskId = null, clamp = true } = {}) {
    if (!canApplyTransaction(effects, excludeTaskId)) return false;
    const nextValues = { ...world.values };
    Object.entries(effects || {}).forEach(([stateId, delta]) => {
        const def = stateDef(stateId);
        let next = Number(nextValues[stateId]) + Number(delta);
        if (def.boundaryMode === 'Klemmen' && clamp) next = Math.min(def.max, Math.max(def.min, next));
        nextValues[stateId] = next;
    });
    world.values = nextValues;
    return true;
}

function intervalDue(row) {
    return world.session >= row.startOffset && ((world.session - row.startOffset) % row.interval === 0);
}

function runWorldFlows() {
    const eligible = worldFlowList
        .filter(row => intervalDue(row) && conditionTrue(row.condition, world.values))
        .sort((a,b) => a.id.localeCompare(b.id));
    eligible.forEach(row => {
        if (!conditionTrue(row.condition, world.values)) return;
        if (applyTransaction(row.effects)) log(`Weltfluss <b>${row.id}</b>: ${escapeHtml(row.flavor || 'ausgeführt')}.`);
        else log(`Weltfluss <b>${row.id}</b> ausgesetzt: Grenzen/Reservierungen lassen die Transaktion nicht zu.`, true);
    });
}

function runProduction() {
    const eligible = productionList
        .filter(row => intervalDue(row) && conditionTrue(row.condition, world.values))
        .sort((a,b) => (a.priority - b.priority) || a.id.localeCompare(b.id));
    eligible.forEach(row => {
        let runs = 0;
        while (runs < row.maxPerSession) {
            if (!conditionTrue(row.condition, world.values)) break;
            if (!applyTransaction(row.effects)) {
                if (runs === 0) log(`Produktion <b>${row.id}</b> ausgesetzt: Grenzen/Reservierungen.`, true);
                break;
            }
            runs++;
        }
        if (runs > 0) log(`Produktion <b>${row.id}</b> ×${runs}: ${escapeHtml(row.flavor || 'ausgeführt')}.`);
    });
}

function runDrift() {
    const reservations = totalReservations();
    stateDefs.forEach(def => {
        if (!def.drift) return;
        const cur = Number(world.values[def.id]);
        if (def.boundaryMode === 'Klemmen') {
            world.values[def.id] = Math.min(def.max, Math.max(def.min, cur + def.drift));
            return;
        }
        const r = reservations[def.id] || { out: 0, in: 0 };
        let allowed = def.drift;
        if (allowed < 0) {
            const floor = def.min + r.out;
            allowed = Math.max(allowed, floor - cur);
        } else {
            const ceil = def.max - r.in;
            allowed = Math.min(allowed, ceil - cur);
        }
        world.values[def.id] = cur + allowed;
    });
}

function expireTasks() {
    const expired = world.activeTasks.filter(t => world.session >= t.createdSession + t.activeDuration);
    expired.forEach(task => {
        const ok = applyTransaction(task.expiryEffects, { excludeTaskId: task.id });
        if (!ok) {
            log(`Ablauf von <b>${task.qId}➔${task.zId}</b> konnte trotz Reservierung nicht gebucht werden. Auftrag bleibt zur Diagnose aktiv.`, true);
            return;
        }
        world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
        log(`Auftrag <b>${task.qId}➔${task.zId}</b> abgelaufen${Object.keys(task.expiryEffects).length ? ' – Verfallseffekte gebucht' : ''}.`);
    });
}

function transportQuantity(q, z) {
    if (systemConfig.Transportmenge === 'NurQ') return q.menge;
    throw new Error(`Nicht unterstützte Transportmengen-Regel: ${systemConfig.Transportmenge}`);
}

function scaleTransportEffects(effects, menge) {
    if (systemConfig.EffekteSkalierung === 'ProWaggon') return scaleEffects(effects, menge);
    throw new Error(`Nicht unterstützte Effektskalierung: ${systemConfig.EffekteSkalierung}`);
}

function buildPairSnapshot(q, z) {
    const menge = transportQuantity(q, z);
    const fulfillmentEffects = mergeEffects(scaleTransportEffects(q.sourceEffects, menge), scaleTransportEffects(z.deliveryEffects, menge));
    const expiryEffects = scaleTransportEffects(q.expiryEffects, menge);
    const reservation = reservationForAlternatives(fulfillmentEffects, expiryEffects);
    return { menge, fulfillmentEffects, expiryEffects, reservation };
}

function activeQGroupCount(groupId) {
    return world.activeTasks.filter(t => t.selectionGroup === groupId).length;
}

function activeTargetGroupCount(targetGroup) {
    return world.activeTasks.filter(t => t.targetGroup === targetGroup).length;
}

function isGroupActive(groupId) {
    return activeQGroupCount(groupId) > 0;
}

function isGroupAtCapacity(groupId) {
    return activeQGroupCount(groupId) >= systemConfig.MaxAktivProQGruppe;
}

function isTargetGroupAtCapacity(targetGroup) {
    return activeTargetGroupCount(targetGroup) >= systemConfig.MaxAktivProZielgruppe;
}

function locationBonusForPair(q, z) {
    const places = [...new Set([q.ort, z.ort].filter(Boolean))];
    return places.reduce((sum, place) => sum + Math.max(0, world.session - Number(world.visitTimes[place] || 0)), 0) * systemConfig.OrtAgingProSession;
}

function pairTouchesOverdueLocation(q, z) {
    const threshold = systemConfig.OrtsausgleichAbSessions;
    if (threshold <= 0) return false;
    return [...new Set([q.ort, z.ort].filter(Boolean))].some(place => world.session - Number(world.visitTimes[place] || 0) >= threshold);
}

function buildEligibleCombinations() {
    const zById = Object.fromEntries(zieleList.map(z => [z.id, z]));
    const combos = [];
    quellenList.forEach(q => {
        if (q.triggerType === 'INTERN') return;
        if (world.session < Number(world.groupTimers[q.selectionGroup] ?? q.startOffset)) return;
        if (isGroupAtCapacity(q.selectionGroup)) return;
        if (!conditionTrue(q.condition, world.values)) return;

        q.allowedTargetIds.forEach(zid => {
            const z = zById[zid];
            if (!z || !z.allowedSourceIds.includes(q.id) || z.rohstoff !== q.rohstoff) return;
            if (isTargetGroupAtCapacity(z.targetGroup)) return;
            if (!conditionTrue(z.condition, world.values)) return;
            if (q.triggerType === 'Notfall' && !conditionTrue(z.emergencyCondition, world.values)) return;
            const snapshot = buildPairSnapshot(q, z);
            if (!canAddReservation(snapshot.reservation)) return;
            combos.push({ q, z, ...snapshot, locationBonus: locationBonusForPair(q,z), overdueLocation: pairTouchesOverdueLocation(q,z) });
        });
    });
    return combos;
}

function weightedChoice(items, getWeight) {
    if (!items.length) return null;
    const weights = items.map(item => Math.max(0, Number(getWeight(item) || 0)));
    const total = weights.reduce((a,b) => a+b, 0);
    if (total <= 0) return items[Math.floor(Math.random() * items.length)];
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
        if (r < weights[i]) return items[i];
        r -= weights[i];
    }
    return items[items.length - 1];
}

function classFactor(triggerType) {
    if (triggerType === 'Zufall') return systemConfig.ZufallsGewichtsfaktor;
    if (triggerType === 'Notfall') return systemConfig.NotfallGewichtsfaktor;
    return 1;
}

function restrictCandidatesByPriority(combos, selectionContext) {
    const emergencies = combos.filter(c => c.q.triggerType === 'Notfall');
    if (emergencies.length) return { combos: emergencies, reason: 'Notfall' };
    const randomDue = systemConfig.ZufallsbevorzugungAbSessions > 0 && (world.session - world.lastRandomCreated >= systemConfig.ZufallsbevorzugungAbSessions);
    if (randomDue) {
        const randoms = combos.filter(c => c.q.triggerType === 'Zufall');
        if (randoms.length) return { combos: randoms, reason: 'Zufall' };
    }
    if (!selectionContext.locationPriorityConsumed) {
        const overdue = combos.filter(c => c.overdueLocation);
        if (overdue.length) return { combos: overdue, reason: 'Ortsausgleich' };
    }
    return { combos, reason: 'Frei' };
}

function chooseCombination(combos, selectionContext) {
    const restriction = restrictCandidatesByPriority(combos, selectionContext);
    const restricted = restriction.combos;
    const byGroup = new Map();
    restricted.forEach(c => {
        if (!byGroup.has(c.q.selectionGroup)) byGroup.set(c.q.selectionGroup, []);
        byGroup.get(c.q.selectionGroup).push(c);
    });
    const groups = [...byGroup.entries()].map(([groupId, groupCombos]) => {
        const uniqueQ = [...new Map(groupCombos.map(c => [c.q.id, c.q])).values()];
        const meanQ = uniqueQ.reduce((s,q) => s + q.gewicht, 0) / uniqueQ.length;
        const factor = Math.max(...uniqueQ.map(q => classFactor(q.triggerType)));
        const locBonus = Math.max(...groupCombos.map(c => c.locationBonus), 0);
        return { groupId, combos: groupCombos, weight: meanQ * factor + Number(world.groupAging[groupId] || 0) + locBonus };
    });
    const chosenGroup = weightedChoice(groups, g => g.weight);
    if (!chosenGroup) return null;

    const byTargetGroup = new Map();
    chosenGroup.combos.forEach(c => {
        if (!byTargetGroup.has(c.z.targetGroup)) byTargetGroup.set(c.z.targetGroup, []);
        byTargetGroup.get(c.z.targetGroup).push(c);
    });
    const targets = [...byTargetGroup.entries()].map(([targetGroup, targetCombos]) => {
        const uniqueZ = [...new Map(targetCombos.map(c => [c.z.id, c.z])).values()];
        const meanZ = uniqueZ.reduce((s,z) => s + z.gewicht, 0) / uniqueZ.length;
        const locBonus = Math.max(...targetCombos.map(c => c.locationBonus), 0);
        return { targetGroup, combos: targetCombos, weight: meanZ + locBonus };
    });
    const chosenTarget = weightedChoice(targets, t => t.weight);
    if (!chosenTarget) return null;
    const combo = weightedChoice(chosenTarget.combos, c => c.q.gewicht * c.z.gewicht);
    return combo ? { combo, priorityReason: restriction.reason } : null;
}

function updateTimerWhenOfferCreated(q) {
    const jitterLimit = systemConfig.CooldownJitter;
    const jitter = jitterLimit > 0 ? randomIntInclusive(-jitterLimit, jitterLimit) : 0;
    const wait = Math.max(1, q.cooldown + jitter);
    world.groupTimers[q.selectionGroup] = world.session + wait;
}

function createTaskFromCombo(combo) {
    if (!canAddReservation(combo.reservation)) return false;
    const q = combo.q;
    const z = combo.z;
    const task = {
        id: `T${world.nextTaskSerial++}`,
        qId: q.id,
        zId: z.id,
        rohstoff: q.rohstoff,
        menge: combo.menge,
        selectionGroup: q.selectionGroup,
        targetGroup: z.targetGroup,
        triggerType: q.triggerType,
        createdSession: world.session,
        activeDuration: q.activeDuration,
        revealed: false,
        fulfillmentEffects: combo.fulfillmentEffects,
        expiryEffects: combo.expiryEffects,
        reservation: combo.reservation,
        quellePersonId: null,
        zielPersonId: null
    };
    assignPersons(task, q, z);
    world.activeTasks.push(task);
    updateTimerWhenOfferCreated(q);
    world.groupAging[q.selectionGroup] = 0;
    if (q.triggerType === 'Zufall') world.lastRandomCreated = world.session;
    log(`Neuer Auftrag <b>${q.id}➔${z.id}</b> (${escapeHtml(q.rohstoff)}, ${task.menge} Waggon${task.menge === 1 ? '' : 's'}).`);
    return true;
}

function selectNewTasks() {
    const selectedGroups = new Set();
    const selectionContext = { locationPriorityConsumed: false };
    let created = 0;
    while (world.activeTasks.length < systemConfig.MaxAktiveAuftraege && created < systemConfig.MaxNeueAuftraegeProSession) {
        const combos = buildEligibleCombinations();
        if (!combos.length) break;
        const chosen = chooseCombination(combos, selectionContext);
        if (!chosen) break;
        if (!createTaskFromCombo(chosen.combo)) break;
        if (chosen.priorityReason === 'Ortsausgleich') selectionContext.locationPriorityConsumed = true;
        selectedGroups.add(chosen.combo.q.selectionGroup);
        created++;
    }

    const finalCombos = buildEligibleCombinations();
    const eligibleGroups = new Set(finalCombos.map(c => c.q.selectionGroup));
    const allGroups = new Set(quellenList.filter(q => q.triggerType !== 'INTERN').map(q => q.selectionGroup));
    allGroups.forEach(groupId => {
        if (selectedGroups.has(groupId) || isGroupActive(groupId)) {
            world.groupAging[groupId] = 0;
        } else if (eligibleGroups.has(groupId)) {
            world.groupAging[groupId] = Number(world.groupAging[groupId] || 0) + systemConfig.AgingProSession;
        } else {
            world.groupAging[groupId] = 0;
        }
    });
}

function runSessionPhases({ includeExpiry = true } = {}) {
    if (includeExpiry) expireTasks();
    runWorldFlows();
    runProduction();
    runDrift();
    selectNewTasks();
}

function qById(id) { return quellenList.find(q => q.id === id); }
function zById(id) { return zieleList.find(z => z.id === id); }
function personById(id) { return personsList.find(p => p.id === id) || null; }

function nextRound() {
    if (!simulationReady || popupBusy) return;
    world.session += 1;
    log(`--- Session ${world.session} gestartet ---`);
    try {
        runSessionPhases({ includeExpiry: true });
        saveWorld();
        render();
    } catch (err) {
        console.error(err);
        showFatal(`Simulationsfehler: ${err.message}`);
    }
}

function manualReset() {
    // Auch nach abgelehntem Migrations-/Neustartdialog muss ein bewusster Reset
    // weiterhin möglich sein, sobald der aktuelle Datensatz erfolgreich geladen ist.
    if (!quellenList.length || !zieleList.length || !stateDefs.length) return;
    const ok = confirm('Kompletten Neustart durchführen? Zustände, aktive Aufträge, Timer, Aging und Besuchszeiten werden neu initialisiert.');
    if (!ok) return;
    world = initialWorld();
    lastPersonByOrt = {};
    clearLog();
    log('Kompletter Neustart durchgeführt.');
    runSessionPhases({ includeExpiry: false });
    saveWorld();
    simulationReady = true;
    render();
}

function revealTask(taskId) {
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;
    task.revealed = true;
    saveWorld();
    render();
}

function completeTask(taskId) {
    if (popupBusy) return;
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;
    const q = qById(task.qId);
    const z = zById(task.zId);
    if (!q || !z) return;

    // Mechanik sofort buchen und speichern. Das Popup ist danach nur noch UI;
    // es darf die Wirtschaft nicht 12+ Sekunden lang in einem ungespeicherten Zustand halten.
    const ok = applyTransaction(task.fulfillmentEffects, { excludeTaskId: task.id });
    if (!ok) {
        log(`Erfüllung <b>${task.qId}➔${task.zId}</b> blockiert: Reservierungs-/Grenzverletzung.`, true);
        render();
        return;
    }
    world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
    [...new Set([q.ort, z.ort].filter(Boolean))].forEach(place => world.visitTimes[place] = world.session);
    log(`Transport <b>${task.qId}➔${task.zId}</b> erfüllt; Effekte atomar gebucht.`);
    saveWorld();
    render();

    popupBusy = true;
    showPersonPopup(task, true, () => {
        popupBusy = false;
        render();
    });
}

function ignoreTask(taskId) {
    if (popupBusy) return;
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;

    // Ablehnung hat mechanisch exakt die Ablaufwirkung und wird ebenfalls sofort persistiert.
    const ok = applyTransaction(task.expiryEffects, { excludeTaskId: task.id });
    if (!ok) {
        log(`Ablehnung <b>${task.qId}➔${task.zId}</b> blockiert: Reservierungs-/Grenzverletzung.`, true);
        render();
        return;
    }
    world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
    log(`Auftrag <b>${task.qId}➔${task.zId}</b> abgelehnt; Verfallseffekte wie beim Ablauf gebucht.`);
    saveWorld();
    render();

    popupBusy = true;
    showPersonPopup(task, false, () => {
        popupBusy = false;
        triggerRejectionGlitch();
        render();
    });
}

function extractImgUrl(html) {
    if (!html) return '';
    const m = String(html).match(/src=["']([^"']+)["']/i);
    return m ? m[1] : '';
}

function normalizePersonData(raw) {
    let bildUrl = cleanCell(getField(raw, 'Bild_URL', 'Bild-URL', 'Bild URL', 'BildURL'));
    if (!bildUrl) bildUrl = extractImgUrl(getField(raw, 'Bild'));
    if (bildUrl.includes(' ')) bildUrl = bildUrl.split(/\s+/)[0];
    return {
        id: cleanCell(getField(raw, 'ID')),
        funktion: cleanCell(getField(raw, 'Funktion')),
        name: cleanCell(getField(raw, 'Name')),
        ort: cleanCell(getField(raw, 'Ort')),
        bildUrl,
        antwortErfuellt: cleanCell(getField(raw, 'Antwort erfüllt', 'Antwort_erfüllt', 'AntwortErfüllt', 'Antwort erfuellt')),
        antwortAbgelehnt: cleanCell(getField(raw, 'Antwort abgelehnt', 'Antwort_abgelehnt', 'AntwortAbgelehnt'))
    };
}

function buildPersonMaps(list) {
    personsByOrt = {};
    ueberallPersons = [];
    list.forEach(p => {
        if (!p.ort) return;
        p.ort.split(/[,/]/).map(s => s.trim()).filter(Boolean).forEach(ort => {
            if (ort.toLowerCase() === 'überall') ueberallPersons.push(p);
            else {
                if (!personsByOrt[ort]) personsByOrt[ort] = [];
                personsByOrt[ort].push(p);
            }
        });
    });
    ueberallPersons = [...new Map(ueberallPersons.map(p => [p.id,p])).values()];
}

function preloadPersonZooms(list) {
    personZoomCache = {};
    list.forEach(p => {
        if (!p.id || !p.bildUrl) return;
        const img = new Image();
        img.onload = () => {
            const ratio = (img.naturalHeight || 1) / (img.naturalWidth || 1);
            let size = '118%', pos = 'center 18%', scaleNum = 1.18;
            if (ratio > 1.3) { size = '108%'; pos = 'center 14%'; scaleNum = 1.08; }
            else if (ratio < 0.85) { size = '125%'; pos = 'center 22%'; scaleNum = 1.25; }
            personZoomCache[p.id] = { size, pos, scaleNum };
        };
        img.src = p.bildUrl;
    });
}

function pickPersonForOrt(ort, excludePersonIds = []) {
    if (!ort) return null;
    const pool = [...(personsByOrt[ort] || []), ...ueberallPersons];
    if (!pool.length) return null;
    const uniquePool = [...new Map(pool.map(p => [p.id,p])).values()];
    let candidates = uniquePool.filter(p => !excludePersonIds.includes(p.id));
    if (!candidates.length) candidates = uniquePool;
    if (candidates.length > 1 && lastPersonByOrt[ort]) {
        const filtered = candidates.filter(p => p.id !== lastPersonByOrt[ort]);
        if (filtered.length) candidates = filtered;
    }
    const picked = candidates[Math.floor(Math.random() * candidates.length)];
    lastPersonByOrt[ort] = picked.id;
    return picked;
}

function assignPersons(task, q, z) {
    const used = world.activeTasks.flatMap(t => [t.quellePersonId, t.zielPersonId]).filter(Boolean);
    const qp = pickPersonForOrt(q.ort, used);
    if (qp) used.push(qp.id);
    const zp = pickPersonForOrt(z.ort, used);
    task.quellePersonId = qp?.id || null;
    task.zielPersonId = zp?.id || null;
}

function renderPersonBlock(person) {
    if (!person) return '';
    if (person.bildUrl) {
        const zoom = personZoomCache[person.id] || { size: '115%', pos: 'center 20%' };
        return `<div class="loc-person-img" style="background-image:url('${escapeAttr(person.bildUrl)}'); background-size:${zoom.size}; background-position:${zoom.pos};" title="${escapeAttr(person.name)} – ${escapeAttr(person.funktion)}"></div>`;
    }
    return `<div class="loc-person-img loc-person-placeholder" title="${escapeAttr(person.name)} – ${escapeAttr(person.funktion)} (Bild folgt)">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20.5c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5"></path>
        </svg></div>`;
}

function showPersonPopup(task, success, onDone) {
    const person = personById(task?.zielPersonId);
    const quote = person ? (success ? person.antwortErfuellt : person.antwortAbgelehnt) : '';
    const overlay = document.getElementById('person-popup-overlay');
    const photoImg = document.getElementById('person-popup-img');
    const photoPlaceholder = document.getElementById('person-popup-placeholder');
    const nameEl = document.getElementById('person-popup-name');
    const quoteEl = document.getElementById('person-popup-quote');
    const stampEl = document.getElementById('person-popup-stamp');
    if (!person || !quote || !overlay || !photoImg || !photoPlaceholder || !nameEl || !quoteEl || !stampEl) {
        onDone();
        return;
    }
    overlay.classList.remove('success','fail');
    overlay.classList.add(success ? 'success' : 'fail');
    if (person.bildUrl) {
        photoImg.src = person.bildUrl;
        photoImg.alt = person.name;
        const zoom = personZoomCache[person.id] || { pos: 'center 18%', scaleNum: 1.15 };
        photoImg.style.objectPosition = zoom.pos;
        photoImg.style.transform = `scale(${zoom.scaleNum || 1.15})`;
        photoImg.style.transformOrigin = zoom.pos;
        photoImg.style.display = 'block';
        photoPlaceholder.style.display = 'none';
    } else {
        photoImg.style.display = 'none';
        photoPlaceholder.style.display = 'flex';
    }
    nameEl.innerText = person.name;
    quoteEl.innerText = quote;
    stampEl.innerText = success ? 'Transport erfüllt' : 'Transport abgelehnt';
    overlay.classList.add('active');
    const duration = Math.max(12000, 12000 + quote.length * 60);
    setTimeout(() => {
        overlay.classList.remove('active');
        setTimeout(onDone, 220);
    }, duration);
}

function pickRandomAbgelehntWords(n) {
    const copy = [...abgelehntWords];
