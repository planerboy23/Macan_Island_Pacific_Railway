<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACAN PACIFIC RAILWAY COMPANY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        html{height:100%;}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0b1118;color:#d1d5db;height:100vh;height:100dvh;width:100%;overflow:hidden;display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px;}
        body::before{content:'';position:fixed;inset:0;z-index:-1;background:url('https://cdnb.artstation.com/p/assets/images/images/024/461/063/large/felicien-nourry-roadbeach07.jpg?1582503487') center/cover no-repeat;}
        header{min-height:44px;background:rgba(17,21,28,0.95);border:1px solid #1e293b;border-radius:6px;padding:5px 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
        h1{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.1rem;line-height:1.05;color:#38bdf8;letter-spacing:1px;text-transform:uppercase;flex:1 1 150px;min-width:0;}
        .round-badge{background:#182232;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;color:#38bdf8;border:1px solid #2563eb55;}
        .controls{display:flex;gap:4px;}
        button{background:#1e3a8a;color:#e2e8f0;border:1px solid #3b82f6aa;padding:4px 10px;font-size:0.75rem;font-weight:600;border-radius:4px;cursor:pointer;}
        button:hover{background:#1d4ed8;border-color:#60a5fa;}
        button.btn-next{background:#1f2937;border-color:#facc15;color:#fde68a;font-weight:600;}
        button.btn-next:hover{background:#2b3648;}
        button.btn-reset{background:#1f2937;border-color:#4b5563;}
        button.btn-reset:hover{background:#374151;}
        main{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;position:relative;}
        .status-msg{color:#cbd5e1;font-size:0.85rem;text-align:center;padding:16px;background:rgba(13,17,23,.92);border:1px solid #1e293b;border-radius:8px;}
        .ereignis-karte{width:100%;max-width:480px;height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;}
        .scroll-area{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:14px 14px 18px;}
        .task-list{display:flex;flex-direction:column;gap:22px;}
        .task-item{background:rgba(13,19,30,0.93);position:relative;isolation:isolate;border:1px solid #1f2937;border-left:3px solid #38bdf8;border-radius:7px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.45);}
        .task-item.collapsed{cursor:pointer;padding:12px;border:1px solid transparent;font-family:'Share Tech Mono',ui-monospace,monospace;transition:filter .18s ease,transform .18s ease;}
        .task-item.collapsed:hover{filter:brightness(1.14);transform:translateY(-1px);}
        .task-item.collapsed.urgency-low{background:rgba(8,89,116,.88);border-color:#38bdf8;}
        .task-item.collapsed.urgency-med{background:rgba(133,77,14,.90);border-color:#fbbf24;}
        .task-item.collapsed.urgency-high{background:rgba(127,29,29,.92);border-color:#f87171;animation:pulse-status 1.6s ease-in-out infinite;}
        .task-item.urgency-low:not(.collapsed){border-left-color:#38bdf8;}
        .task-item.urgency-med:not(.collapsed){border-left-color:#fbbf24;}
        .task-item.urgency-high:not(.collapsed){border-left-color:#ef4444;}
        @keyframes pulse-status{50%{filter:brightness(1.22);box-shadow:0 0 18px rgba(248,113,113,.35);}
        }
        .radio-header{display:flex;justify-content:space-between;align-items:center;gap:10px;}
        .radio-freq{display:flex;align-items:center;gap:7px;min-width:0;font-size:.92rem;letter-spacing:.5px;color:#f8fafc;}
        .radio-tower{font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif;font-size:1.05rem;line-height:1;}
        .radio-signal{flex-shrink:0;font-size:.72rem;letter-spacing:.7px;color:#f8fafc;font-weight:700;}
        .cargo-badge{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.2rem;letter-spacing:1.2px;color:#fbbf24;background:rgba(120,53,15,.25);border:1px solid #78350f88;border-radius:5px;padding:6px 8px;}
        .cargo-svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
        .cargo-units{display:flex;align-items:center;gap:2px;padding-left:5px;border-left:1px solid rgba(251,191,36,.35);}
        .cargo-units .cargo-svg{width:17px;height:17px;}
        .loc-block{background:rgba(17,24,39,.9);border:1px solid #334155;border-left:3px solid #38bdf8;border-radius:5px;padding:7px 8px;display:flex;align-items:center;gap:10px;}
        .loc-block.demand{border-left-color:#f87171;}
        .loc-person-img{position:relative;overflow:hidden;flex-shrink:0;width:95px;height:130px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background-color:#0b0f17;background-repeat:no-repeat;background-size:cover;background-position:center 15%;transition:background-size .3s ease,background-position .3s ease;}
        .person-name-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(2,6,10,.96),rgba(2,6,10,.58) 62%,transparent);color:#fff;font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:.85rem;letter-spacing:.8px;text-align:center;padding:10px 2px 3px;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .loc-person-placeholder{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)!important;border-style:dashed;}
        .loc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
        .loc-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.55px;color:#cbd5e1;font-weight:700;}
        .loc-name{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.2rem;letter-spacing:.6px;color:#fff;}
        .loc-reason{font-size:.82rem;line-height:1.35;color:#d1d5db;}
        .loc-flavor{margin-top:2px;font-size:.78rem;line-height:1.35;font-style:italic;color:#93c5fd;}
        .urgency-high .loc-flavor{color:#fecaca;}
        .connector{text-align:center;font-size:.85rem;color:#64748b;line-height:1;margin:-2px 0;}
        .flavor-box{font-size:.72rem;color:#cbd5e1;background:rgba(0,0,0,.28);padding:4px 6px;border-radius:3px;}
        .counter-voice{font-size:.74rem;line-height:1.3;color:#fecaca;background:rgba(127,29,29,.2);border:1px solid rgba(248,113,113,.28);padding:5px 7px;border-radius:4px;}
        .counter-voice b{color:#fca5a5;}
        .task-actions{display:flex;gap:5px;margin-top:2px;}
        .btn-task{flex:1;padding:5px;font-size:.72rem;border-radius:3px;}
        .btn-done{background:#065f46;border-color:#10b981aa;color:#ecfdf5;}
        .btn-done:hover{background:#047857;}
        .btn-ignore{background:#374151;border-color:#4b5563;color:#d1d5db;}
        .btn-ignore:hover{background:#4b5563;}
        #reject-overlay{position:fixed;inset:0;background:rgba(2,6,10,0.88);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}
        #reject-overlay.active{opacity:1;pointer-events:all;}
        .glitch-stack{position:relative;display:inline-block;font-family:'Bebas Neue','Segoe UI',sans-serif;text-align:center;animation:glitchFlicker 0.5s steps(2) infinite;}
        @keyframes glitchFlicker{0%,100%{opacity:1;}
        42%{opacity:0.78;}
        48%{opacity:1;}
        70%{opacity:0.55;}
        74%{opacity:1;}
        }
        .glitch-layer{letter-spacing:4px;white-space:nowrap;font-size:clamp(1.8rem,10vw,3.2rem);}
        .glitch-layer.main{position:relative;color:#ffffff;}
        .glitch-layer.mirror-x{position:absolute;top:0;left:0;width:100%;color:#38bdf8;opacity:0.25;transform:scaleX(-1);}
        .glitch-layer.mirror-y{position:absolute;top:0;left:0;width:100%;color:#7dd3fc;opacity:0.18;transform:scaleY(-1);}
        .glitch-layer.ghost{position:absolute;top:0;left:0;width:100%;color:#38bdf8;opacity:0.35;transform:translate(4px,-3px) skewX(-5deg);}
        .letter{display:inline-block;opacity:0;transform:translateY(-55px);transition:transform 0.32s cubic-bezier(0.2,0.9,0.3,1.15),opacity 0.28s ease;}
        .letter.settle{opacity:1;transform:translateY(0);}
        #person-popup-overlay{position:fixed;inset:0;z-index:1000;display:flex;padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
        #person-popup-overlay.active{opacity:1;pointer-events:all;}
        #person-popup-overlay.success{background:radial-gradient(circle at 50% 38%,rgba(16,185,129,0.35),rgba(2,6,10,0.94) 70%);}
        #person-popup-overlay.fail{background:radial-gradient(circle at 50% 38%,rgba(190,18,18,0.4),rgba(2,6,10,0.96) 70%);animation:fail-screen-flash 0.5s ease-out;}
        @keyframes fail-screen-flash{0%{background-color:rgba(239,68,68,0.85);}
        100%{background-color:transparent;}
        }
        .person-popup-card{width:100%;max-width:420px;margin:auto;padding:20px 0 12px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transform:scale(0.7);opacity:0;transition:transform 0.4s cubic-bezier(0.22,1.1,0.3,1.35),opacity 0.3s ease;}
        #person-popup-overlay.active .person-popup-card{transform:scale(1);opacity:1;}
        #person-popup-overlay.fail.active .person-popup-card{animation:fail-shake 0.42s ease-in-out 0.05s 3;}
        @keyframes fail-shake{0%,100%{transform:translateX(0) rotate(0deg) scale(1);}
        25%{transform:translateX(-8px) rotate(-1.6deg) scale(1);}
        75%{transform:translateX(8px) rotate(1.6deg) scale(1);}
        }
        .person-popup-stamp{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:clamp(1.4rem,6.5vw,2.1rem);line-height:1.1;letter-spacing:2px;text-transform:uppercase;padding:4px 16px;border-radius:4px;transform:rotate(-4deg);max-width:94%;text-align:center;margin-bottom:4px;}
        #person-popup-overlay.success .person-popup-stamp{color:#052e1d;background:#34d399;box-shadow:0 0 30px rgba(52,211,153,0.75);animation:stamp-pop-success 0.9s cubic-bezier(0.22,1.1,0.3,1.4);}
        #person-popup-overlay.fail .person-popup-stamp{color:#fff5f5;background:#b91c1c;box-shadow:0 0 30px rgba(220,38,38,0.75);}
        @keyframes stamp-pop-success{0%{transform:rotate(-4deg) scale(2.4);opacity:0;}
        60%{transform:rotate(-4deg) scale(0.92);opacity:1;}
        100%{transform:rotate(-4deg) scale(1);opacity:1;}
        }
        .person-popup-photo{position:relative;width:min(44vw,28dvh,180px);height:min(44vw,28dvh,180px);border-radius:16px;background:#0b0f17;flex-shrink:0;overflow:hidden;isolation:isolate;}
        .person-popup-photo::before{content:'';position:absolute;inset:0;border-radius:16px;overflow:hidden;}
        .person-popup-img,.person-popup-placeholder{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;overflow:hidden;}
        .person-popup-img{z-index:0;object-fit:cover;object-position:center 18%;display:none;transition:transform 0.3s ease,object-position 0.3s ease;}
        .person-popup-placeholder{display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);}
        #person-popup-overlay.success .person-popup-photo{box-shadow:0 0 0 4px #34d399,0 0 55px 8px rgba(52,211,153,0.6),0 10px 40px rgba(0,0,0,0.6);animation:photo-glow-success 1.1s ease-in-out infinite;}
        #person-popup-overlay.fail .person-popup-photo{box-shadow:0 0 0 4px #f87171,0 0 55px 8px rgba(248,113,113,0.55),0 10px 40px rgba(0,0,0,0.6);}
        @keyframes photo-glow-success{0%,100%{filter:brightness(1);}
        50%{filter:brightness(1.22);}
        }
        .person-popup-confetti{position:absolute;inset:0;z-index:1;overflow:visible;pointer-events:none;}
        .person-popup-confetti span{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:2px;background:#34d399;opacity:0;}
        #person-popup-overlay.success.active .person-popup-confetti span{animation:confetti-burst 0.9s ease-out forwards;}
        .person-popup-confetti span:nth-child(1){background:#34d399;--r:0deg;animation-delay:0.05s;}
        .person-popup-confetti span:nth-child(2){background:#fbbf24;--r:30deg;animation-delay:0.09s;}
        .person-popup-confetti span:nth-child(3){background:#38bdf8;--r:60deg;animation-delay:0.02s;}
        .person-popup-confetti span:nth-child(4){background:#34d399;--r:90deg;animation-delay:0.12s;}
        .person-popup-confetti span:nth-child(5){background:#fbbf24;--r:120deg;animation-delay:0.06s;}
        .person-popup-confetti span:nth-child(6){background:#38bdf8;--r:150deg;animation-delay:0.1s;}
        .person-popup-confetti span:nth-child(7){background:#34d399;--r:180deg;animation-delay:0.04s;}
        .person-popup-confetti span:nth-child(8){background:#fbbf24;--r:210deg;animation-delay:0.13s;}
        .person-popup-confetti span:nth-child(9){background:#38bdf8;--r:240deg;animation-delay:0.07s;}
        .person-popup-confetti span:nth-child(10){background:#34d399;--r:270deg;animation-delay:0.01s;}
        .person-popup-confetti span:nth-child(11){background:#fbbf24;--r:300deg;animation-delay:0.11s;}
        .person-popup-confetti span:nth-child(12){background:#38bdf8;--r:330deg;animation-delay:0.08s;}
        @keyframes confetti-burst{0%{opacity:1;transform:rotate(var(--r,0deg)) translate(0,0) scale(1);}
        100%{opacity:0;transform:rotate(var(--r,0deg)) translate(120px,-10px) scale(0.4);}
        }
        .person-popup-name{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:clamp(1.1rem,5.5vw,1.5rem);letter-spacing:1px;color:#ffffff;text-transform:uppercase;}
        .person-popup-quote{font-size:clamp(0.85rem,4.2vw,1.05rem);line-height:1.45;color:#f3f4f6;font-style:italic;padding:0 6px;max-width:34ch;}
        #person-popup-overlay.fail .person-popup-quote{color:#fecaca;}

        /* ===== Betriebslage (Zustände) ===== */
        .state-panel{width:100%;max-width:480px;margin:0 auto;max-height:46dvh;overflow-y:auto;overscroll-behavior:contain;background:rgba(13,19,30,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #1e293b;border-radius:8px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.45);flex-shrink:0;}
        .state-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
        .state-head-title{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.05rem;letter-spacing:1.2px;color:#e2e8f0;display:flex;align-items:center;gap:6px;}
        .state-head-title i{font-style:normal;color:#38bdf8;}
        .state-toggle{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.7rem;color:#64748b;border:1px solid #243247;border-radius:10px;padding:2px 8px;}
        .state-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;}
        .state-strip::-webkit-scrollbar{display:none;}
        .chip{flex:0 0 auto;min-width:74px;background:rgba(2,6,12,.55);border:1px solid #243247;border-radius:8px;padding:5px 7px 6px;display:flex;flex-direction:column;gap:3px;}
        .chip-top{display:flex;align-items:center;gap:5px;font-size:.95rem;line-height:1;}
        .chip-top b{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.95rem;color:#f8fafc;font-weight:400;}
        .chip-id{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.6rem;color:#64748b;letter-spacing:.5px;}
        .state-groups{display:flex;flex-direction:column;gap:10px;padding-top:10px;}
        .state-group-title{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:.85rem;letter-spacing:1.3px;color:#7dd3fc;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
        .state-group-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,#243247,transparent);}
        .state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
        .state-tile{--c:#38bdf8;position:relative;background:linear-gradient(160deg,rgba(20,32,50,.9),rgba(6,10,18,.92));border:1px solid #243247;border-top:2px solid var(--c);border-radius:8px;padding:7px 8px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;}
        .state-tile.warn{--c:#fbbf24;}
        .state-tile.crit{--c:#f87171;animation:tile-pulse 1.8s ease-in-out infinite;}
        @keyframes tile-pulse{50%{box-shadow:0 0 14px rgba(248,113,113,.4);}}
        .st-top{display:flex;align-items:center;gap:6px;min-width:0;}
        .st-icon{font-size:1.05rem;line-height:1;flex:none;}
        .st-name{font-size:.68rem;line-height:1.15;color:#cbd5e1;text-transform:uppercase;letter-spacing:.4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;}
        .st-val{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.7rem;line-height:1;color:#fff;letter-spacing:.5px;display:flex;align-items:baseline;gap:4px;}
        .st-val small{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.65rem;color:#64748b;letter-spacing:0;}
        .gauge{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
        .gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(to right,color-mix(in srgb,var(--c) 55%,#000),var(--c));transition:width .4s ease;}
        .gauge .res{position:absolute;top:0;bottom:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 2px,transparent 2px 5px);opacity:.85;}
        .gauge .res.out{background-color:rgba(239,68,68,.75);}
        .gauge .res.in{background-color:rgba(52,211,153,.75);}
        .st-meta{display:flex;flex-wrap:wrap;gap:3px;min-height:14px;}
        .tag{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.6rem;line-height:1;padding:2px 5px;border-radius:8px;border:1px solid #243247;color:#94a3b8;background:rgba(0,0,0,.3);}
        .tag.out{color:#fca5a5;border-color:rgba(248,113,113,.4);}
        .tag.in{color:#6ee7b7;border-color:rgba(52,211,153,.4);}
        .tag.id{color:#64748b;}

        /* ===== Protokoll (Dock + Sheet) ===== */
        #log-dock{flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:40px;width:100%;max-width:480px;margin:0 auto;background:rgba(17,21,28,.95);border:1px solid #1e293b;border-radius:8px;padding:6px 10px;color:#cbd5e1;font-size:.75rem;cursor:pointer;text-align:left;font-weight:400;-webkit-tap-highlight-color:transparent;}
        #log-dock:hover{background:rgba(17,21,28,.95);border-color:#1e293b;}
        #log-dock .dock-ic{font-size:1rem;flex:none;}
        #log-dock .dock-label{font-family:'Bebas Neue','Segoe UI',sans-serif;letter-spacing:1px;font-size:.95rem;color:#e2e8f0;flex:none;}
        #log-dock .dock-last{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#94a3b8;}
        #log-dock .dock-count{flex:none;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.68rem;background:#182232;color:#38bdf8;border:1px solid #2563eb55;border-radius:10px;padding:1px 7px;}
        #log-sheet{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(2,6,10,.6);opacity:0;pointer-events:none;transition:opacity .2s ease;}
        #log-sheet.open{opacity:1;pointer-events:all;}
        .sheet-panel{width:100%;max-width:520px;margin:0 auto;max-height:72dvh;display:flex;flex-direction:column;background:#0d131c;border:1px solid #1e293b;border-bottom:none;border-radius:16px 16px 0 0;padding:10px 12px max(12px,env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s ease;}
        #log-sheet.open .sheet-panel{transform:translateY(0);}
        .sheet-grip{width:42px;height:4px;border-radius:2px;background:#334155;margin:0 auto 8px;flex:none;}
        .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex:none;}
        .sheet-head b{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.15rem;letter-spacing:1.2px;color:#e2e8f0;font-weight:400;}
        .log-list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;}
        .log-item{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid #1b2636;border-left:3px solid #38bdf8;border-radius:6px;padding:6px 8px;font-size:.78rem;line-height:1.35;color:#cbd5e1;}
        .log-item.warn{border-left-color:#f87171;background:rgba(127,29,29,.18);color:#fecaca;}
        .log-ses{flex:none;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.65rem;color:#38bdf8;border:1px solid #2563eb55;background:#182232;border-radius:8px;padding:2px 6px;margin-top:1px;}
        .log-item.warn .log-ses{color:#fca5a5;border-color:rgba(248,113,113,.4);background:rgba(127,29,29,.3);}
        .log-empty{color:#64748b;font-size:.8rem;text-align:center;padding:14px;}
        @media (max-width:380px){.btn-task{font-size:.68rem;}}

        /* ===== v3 ===== */
        /* Karten selbst: scharf & deckend. Nur der schwarze Hof dahinter ist geblurt. */
        .task-item,.task-item.collapsed.urgency-low,.task-item.collapsed.urgency-med,.task-item.collapsed.urgency-high{background-color:#0d131e;}
        .task-item.collapsed.urgency-low{background-color:#0a5472;}
        .task-item.collapsed.urgency-med{background-color:#7c4510;}
        .task-item.collapsed.urgency-high{background-color:#7f1d1d;}
        .task-item::before{content:'';position:absolute;inset:-9px;z-index:-1;border-radius:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);pointer-events:none;}
        .radio-signal{display:flex;align-items:center;gap:8px;}
        .pips{display:inline-flex;gap:3px;align-items:center;}
        .pip{width:7px;height:7px;border-radius:50%;background:#f8fafc;display:block;}
        .pip.off{background:rgba(255,255,255,.22);}
        .urgency-high .pip:not(.off){background:#fecaca;box-shadow:0 0 6px #f87171;}
        .flavor-box .pips{margin-right:6px;vertical-align:middle;}
        .chip.idle,.state-tile.idle{opacity:.4;filter:grayscale(.85);}
        .state-tile.idle{opacity:.55;}
        .chip-imp{display:flex;gap:3px;min-height:12px;}
        .imp{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.62rem;line-height:1;padding:2px 4px;border-radius:6px;white-space:nowrap;}
        .imp.up{color:#6ee7b7;background:rgba(52,211,153,.14);}
        .imp.dn{color:#fca5a5;background:rgba(248,113,113,.15);}
        .state-head-title small{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.62rem;color:#64748b;letter-spacing:0;margin-left:2px;}
        .state-legend{font-size:.6rem;color:#64748b;padding-top:4px;}
        /* Popup: Fracht-Icon */
        .fx-cargo{--c:#fbbf24;position:relative;flex:none;width:min(26vw,96px);height:min(26vw,96px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(0,0,0,.55));border:3px solid var(--c);box-shadow:0 0 30px var(--c);}
        .fx-svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        .fx-cargo[data-n]::after{content:attr(data-n);position:absolute;right:-10px;bottom:-6px;font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.1rem;letter-spacing:1px;padding:0 8px;border-radius:10px;background:var(--c);color:#111;}
        .fx-cargo::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);opacity:0;}
        .fx-cargo i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:2px;opacity:0;pointer-events:none;}
        @keyframes fx-fly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1.2);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);}}
        #person-popup-overlay.active .fx-cargo i{animation:fx-fly 1s ease-out forwards;}
        #person-popup-overlay.success.active .fx-cargo{animation:fx-win .85s cubic-bezier(.2,1.3,.4,1) both,fx-bob 1.2s ease-in-out .9s infinite;}
        #person-popup-overlay.success.active .fx-cargo::before{animation:fx-ring .9s ease-out .35s 2;}
        @keyframes fx-win{0%{transform:scale(0) rotate(-50deg);}55%{transform:scale(1.45) rotate(10deg);}78%{transform:scale(.92) rotate(-3deg);}100%{transform:scale(1) rotate(0);}}
        @keyframes fx-bob{50%{transform:translateY(-5px) scale(1.04);}}
        @keyframes fx-ring{0%{opacity:.9;transform:scale(1);}100%{opacity:0;transform:scale(2.4);}}
        #person-popup-overlay.fail .fx-cargo{--c:#f87171;color:#94a3b8;}
        #person-popup-overlay.fail.active .fx-cargo{animation:fx-fail 1.1s ease-in both;}
        #person-popup-overlay.fail.active .fx-cargo::before{inset:-6px;border:0;border-radius:0;background:linear-gradient(135deg,transparent 45%,#f87171 45% 55%,transparent 55%);animation:fx-slash .25s ease-out .4s both;}
        @keyframes fx-fail{0%{transform:scale(.2);opacity:0;}22%{transform:scale(1.12);opacity:1;}34%{transform:translateX(-7px);}42%{transform:translateX(7px);}50%{transform:translateX(-5px);}58%{transform:translateX(0);}100%{transform:translateY(16px) rotate(-14deg) scale(.88);opacity:.7;}}
        @keyframes fx-slash{from{opacity:1;transform:scale(0);}to{opacity:1;transform:scale(1);}}
        /* Grosse Meldungen */
        #ann-layer{position:fixed;left:0;right:0;top:max(10px,env(safe-area-inset-top));z-index:1200;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;pointer-events:none;}
        .ann{pointer-events:auto;position:relative;overflow:hidden;width:100%;max-width:480px;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#251a05,#0b1018 70%);border:2px solid #fbbf24;border-radius:14px;padding:12px 14px 17px;box-shadow:0 0 0 4px rgba(251,191,36,.18),0 14px 40px rgba(0,0,0,.75);animation:ann-in .5s cubic-bezier(.2,1.4,.4,1) both;}
        .ann.out{animation:ann-out .3s ease-in forwards;}
        @keyframes ann-in{from{transform:translateY(-130%) scale(.9);opacity:0;}to{transform:none;opacity:1;}}
        @keyframes ann-out{to{transform:translateY(-130%);opacity:0;}}
        .ann-av{flex:none;width:64px;height:64px;border-radius:12px;background:#0b0f17 center/cover no-repeat;border:2px solid #fbbf24;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
        .ann-body{min-width:0;}
        .ann-who{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.05rem;letter-spacing:1.2px;color:#fbbf24;text-transform:uppercase;line-height:1.1;}
        .ann-text{font-size:clamp(1.05rem,4.6vw,1.3rem);font-weight:700;line-height:1.28;color:#fff;margin-top:2px;overflow-wrap:anywhere;}
        .ann-sub{font-size:.75rem;color:#94a3b8;margin-top:4px;}
        .ann-bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:#fbbf24;transform-origin:left;animation:ann-bar var(--d) linear forwards;}
        @keyframes ann-bar{to{transform:scaleX(0);}}

        /* ===== v4: kompakter Frachtauftrag (alles in rem/clamp/%, skaliert mit der Schriftgröße) ===== */
        .task-item{position:relative;}
        .task-item:not(.collapsed){gap:.4rem;padding:.5rem;}
        .task-item.vertagt.collapsed{opacity:.72;}
        .loc-block.compact{gap:.6rem;padding:.4rem .55rem .4rem .4rem;align-items:stretch;}
        .loc-block.compact .loc-person-img{width:clamp(4rem,18vw,5.6rem);height:auto;min-height:5.6rem;align-self:stretch;border-radius:.4rem;}
        .loc-block.compact .person-name-overlay{font-size:clamp(.56rem,2.7vw,.66rem);line-height:1.05;padding:.9rem .1rem .2rem;letter-spacing:.2px;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;hyphens:auto;}
        .loc-block.compact .loc-person-placeholder svg{width:1.8rem;height:1.8rem;}
        .loc-block.compact .loc-info{gap:.18rem;justify-content:center;}
        .loc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.05rem .5rem;}
        .loc-block.compact .loc-name{font-size:1.15rem;line-height:1.1;}
        .loc-block.compact .loc-label{font-size:.72rem;}
        .loc-block.compact .loc-reason{font-size:.8rem;line-height:1.3;}
        .quote{all:unset;box-sizing:border-box;display:block;cursor:pointer;margin-top:.1rem;font-size:.76rem;line-height:1.3;font-style:italic;color:#93c5fd;-webkit-tap-highlight-color:transparent;}
        .quote>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
        .quote.open>span{-webkit-line-clamp:unset;display:block;}
        .quote.long::after{content:'▾ mehr';display:block;font-style:normal;font-size:.62rem;color:#64748b;font-family:'Share Tech Mono',ui-monospace,monospace;}
        .quote.long.open::after{content:'▴ weniger';}
        .urgency-high .quote{color:#fecaca;}
        .cargo-strip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:'Bebas Neue','Segoe UI',sans-serif;letter-spacing:1px;color:#fbbf24;background:rgba(120,53,15,.25);border:1px solid #78350f88;border-radius:.4rem;padding:.3rem .55rem;}
        .cargo-strip .cargo-svg{width:1.4rem;height:1.4rem;}
        .cargo-strip .cargo-name{font-size:1.1rem;line-height:1;}
        .cargo-strip .cargo-units{border-left:1px solid rgba(251,191,36,.35);padding-left:.4rem;}
        .cargo-strip .cargo-units .cargo-svg{width:1rem;height:1rem;}
        .cargo-strip .cargo-time{margin-left:auto;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.66rem;letter-spacing:0;color:#cbd5e1;}
        .counter-voice{all:unset;box-sizing:border-box;display:block;cursor:pointer;font-size:.72rem;line-height:1.3;color:#fecaca;background:rgba(127,29,29,.2);border:1px solid rgba(248,113,113,.28);padding:.3rem .5rem;border-radius:.3rem;}
        .counter-voice>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;}
        .counter-voice.open>span{-webkit-line-clamp:unset;display:block;}
        .btn-task{padding:.5rem .4rem;font-size:.78rem;min-height:2.5rem;border-radius:.3rem;}
        .vertagt-note{font-size:.74rem;line-height:1.3;color:#fbbf24;background:rgba(251,191,36,.08);border:1px dashed rgba(251,191,36,.4);border-radius:.3rem;padding:.4rem .55rem;text-align:center;}
        .fp{display:inline-flex;gap:3px;margin-left:.5rem;vertical-align:middle;}
        .task-item .radio-freq{white-space:nowrap;font-size:clamp(.7rem,3.5vw,.92rem);}
        .task-item .radio-signal{white-space:nowrap;font-size:clamp(.62rem,3vw,.72rem);}
        .fp small{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.6rem;color:#94a3b8;margin-right:.1rem;}
        .fp i{width:.55rem;height:.55rem;border-radius:2px;background:#fbbf24;display:block;}
        .fp i.used{background:rgba(255,255,255,.22);}
        #fb-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 4.6rem);transform:translate(-50%,20px);z-index:1100;width:min(92vw,26rem);display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:.6rem;background:rgba(8,12,18,.96);border:1px solid #334155;border-left:4px solid #34d399;box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
        #fb-toast.show{opacity:1;transform:translate(-50%,0);}
        #fb-toast.fail{border-left-color:#f87171;}
        #fb-toast .fb-ic{flex:none;width:2.2rem;height:2.2rem;color:#34d399;}
        #fb-toast.fail .fb-ic{color:#f87171;}
        #fb-toast .fb-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        #fb-toast .fb-body{min-width:0;display:flex;flex-direction:column;gap:.25rem;}
        #fb-toast .fb-title{font-family:'Bebas Neue','Segoe UI',sans-serif;letter-spacing:1.1px;font-size:1.05rem;line-height:1;color:#f8fafc;}
        #fb-toast .fb-eff{display:flex;flex-wrap:wrap;gap:.25rem;}

        /* ===== v5: Meta-Leiste, Betriebslage-Beschriftung, kompakte eingeklappte Karten ===== */
        .meta-strip{flex-shrink:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:.35rem;}
        .meta-row{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;}
        .meta-row::-webkit-scrollbar{display:none;}
        .mchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:.35rem;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.72rem;line-height:1.1;color:#e2e8f0;background:rgba(13,19,30,.93);border:1px solid #243247;border-radius:999px;padding:.32rem .65rem;cursor:pointer;-webkit-tap-highlight-color:transparent;}
        .mchip b{font-weight:400;color:#7dd3fc;}
        .mchip.sz{border-color:#78350f;color:#fbbf24;}
        .mchip.ks{border-color:#1e3a5f;}
        .mchip .ok{color:#6ee7b7;} .mchip .no{color:#fca5a5;}
        .meta-detail{background:rgba(13,19,30,.95);border:1px solid #243247;border-radius:.6rem;padding:.55rem .65rem;font-size:.78rem;line-height:1.35;color:#cbd5e1;display:flex;flex-direction:column;gap:.5rem;}
        .meta-detail .md-title{font-family:'Bebas Neue','Segoe UI',sans-serif;letter-spacing:1px;font-size:.95rem;color:#e2e8f0;}
        .k-row{display:flex;flex-direction:column;gap:.2rem;border-left:3px solid #38bdf8;padding-left:.5rem;}
        .k-row.p1{border-left-color:#94a3b8;} .k-row.p9{border-left-color:#67e8f9;}
        .k-row .k-who{font-weight:700;color:#f8fafc;}
        .k-row .k-eff{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;font-size:.68rem;color:#94a3b8;}
        .k-row .k-quote{font-style:italic;color:#93c5fd;font-size:.74rem;}
        .chip{min-width:5.2rem;}
        .chip-name{font-size:.58rem;line-height:1.1;color:#cbd5e1;text-transform:uppercase;letter-spacing:.3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:1.3em;}
        .chip.more{align-items:center;justify-content:center;cursor:pointer;color:#7dd3fc;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.95rem;min-width:3.6rem;}
        .chip.more small{font-size:.58rem;color:#64748b;}
        .st-desc{font-size:.6rem;line-height:1.25;color:#94a3b8;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
        .st-name{font-size:.74rem;color:#f1f5f9;font-weight:700;}
        .task-item.collapsed{padding:.55rem .75rem;}
        .c-row{display:flex;align-items:center;gap:.65rem;min-width:0;}
        .c-ic{flex:none;width:1.9rem;height:1.9rem;color:#fbbf24;display:flex;align-items:center;justify-content:center;}
        .c-ic .cargo-svg{width:100%;height:100%;}
        .c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.12rem;}
        .c-title{font-family:'Bebas Neue','Segoe UI',sans-serif;font-size:1.15rem;letter-spacing:1px;line-height:1;color:#fff;}
        .c-route{font-size:.72rem;line-height:1.2;color:#e2e8f0;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .c-fork{color:#fbbf24;margin-left:.3rem;font-size:.9rem;}
        .fork-note{font-size:.72rem;line-height:1.3;color:#fde68a;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:.3rem;padding:.35rem .5rem;}
        #fb-toast .fb-fork{font-size:.7rem;color:#fde68a;}

/* ===== v6: Weiß/Cyan, Gelb nur für Aktion ===== */
        :root{--cy:#38bdf8;--line:#2a3b50;--mut:#94a3b8;--crit:#f87171;}
        body::before{filter:blur(1px) brightness(.9);transform:scale(1.02);}
        .task-item::before{display:none;}
        .round-badge{color:#f1f5f9;border-color:var(--line);}
        .fp i{background:var(--cy);}
        .task-item.collapsed[class*=urgency]{background-color:#0c141d;border:1px solid var(--line);border-left:3px solid #3b6b82;animation:none;}
        .task-item.collapsed.urgency-med,.task-item.urgency-med:not(.collapsed){border-left-color:#64748b;}
        .task-item.urgency-high{border-left-color:var(--crit)!important;}
        .c-ic,.c-fork,.cargo-strip .cargo-svg{color:var(--cy);}
        .c-route,.task-item .radio-signal,.cargo-strip .cargo-time{color:var(--mut);opacity:1;}
        .urgency-high .radio-signal{color:var(--crit);}
        .pip,.urgency-high .pip:not(.off){background:#f1f5f9;}
        .urgency-high .pip:not(.off){background:var(--crit);box-shadow:none;}
        .cargo-strip{color:#f1f5f9;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;}
        .cargo-strip .cargo-time b{color:var(--crit);font-weight:400;margin-right:.45rem;}
        .loc-block.demand{border-left-color:#94a3b8;}
        .quote,.loc-flavor,.urgency-high .quote,.urgency-high .loc-flavor{color:#93c5fd;}
        .counter-voice{color:#e2e8f0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid var(--crit);}
        .counter-voice b{color:#f1f5f9;}
        .fork-note{color:#e2e8f0;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.35);}
        .vertagt-note{color:var(--mut);background:rgba(255,255,255,.04);border:1px dashed var(--line);}
        .k-row.p1{border-left-color:#94a3b8;} .k-row.p9{border-left-color:var(--cy);}
        .task-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
        .freq{position:absolute;top:-.55rem;right:.9rem;padding:0 .4rem;background:#0c141d;border-radius:.3rem;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.62rem;letter-spacing:.6px;color:var(--cy);pointer-events:none;}
        .cargo-strip .cargo-time::after{content:' ▴';color:var(--cy);}
        /* Aufklappen: großes Abstimm-Rad, Frequenzen laufen oben durch */
        .dial{position:absolute;inset:0;z-index:5;border-radius:inherit;background:#0a1118;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25% 0 1.1rem;transition:opacity .35s ease;pointer-events:none;}
        .dial.out{opacity:0;}
        .dial .d-freq{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:1.25rem;letter-spacing:2px;color:var(--cy);}
        .dial .d-wheel{position:relative;overflow:hidden;width:82%;height:2.6rem;border-radius:.6rem;background:#05090e;box-shadow:inset 0 4px 10px #000,0 0 0 2px #2a3b50;}
        .dial .d-wheel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#55667d 0 7px,#18212d 7px 14px);animation:d-roll .8s cubic-bezier(.45,0,.25,1) forwards;}
        .dial .d-wheel::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 38%,transparent 62%,rgba(0,0,0,.8)),linear-gradient(to right,rgba(0,0,0,.6),transparent 18%,transparent 82%,rgba(0,0,0,.6));}
        @keyframes d-roll{to{background-position:-196px 0}}
        @media (prefers-reduced-motion:reduce){.dial .d-wheel::before{animation:none}}
        .mchip.one{gap:.5rem;max-width:100%;}
        .mchip.one .sep{width:1px;align-self:stretch;background:var(--line);}
        .mchip.one .sc{color:var(--cy);}
        .chip-imp{display:flex;gap:.45rem;min-height:.9rem;}
        .chip-imp .imp{background:none!important;border:none!important;padding:0!important;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:.62rem;}
        .ann{background:linear-gradient(135deg,#0b1d29,#0b1018 70%);border-color:var(--cy);box-shadow:0 0 0 4px rgba(56,189,248,.12),0 14px 40px rgba(0,0,0,.75);}
        .ann-av{border-color:var(--cy);} .ann-who{color:var(--cy);} .ann-bar{background:var(--cy);}
        .task-item,.task-item *{touch-action:manipulation;}
        /* Blaue Fläche = klebendes :hover des globalen button-Stils auf Touchgeräten */
        .quote:hover,.quote:active,.quote:focus{background:none!important;border:0!important;outline:none;box-shadow:none;}
        .counter-voice:hover,.counter-voice:active,.counter-voice:focus{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important;border-left-color:var(--crit)!important;outline:none;}
        .quote,.quote *,.counter-voice,.counter-voice *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
    </style>
</head>

    <div class="round-badge" id="round-display">Session: 1</div>
    <div class="controls">
        <button class="btn-reset" onclick="manualReset()">Reset</button>
        <button class="btn-next" onclick="nextRound()">Weiter funken</button>
    </div>
</header>

<section class="meta-strip" id="meta-strip" style="display:none"></section>

<main>
    <div class="ereignis-karte">

            <div class="task-list" id="task-container">
                <div class="status-msg">Lade Daten aus Google Sheets...</div>
            </div>
        </div>
    </div>
</main>

<section class="state-panel" id="state-panel" style="display:none"></section>

<button id="log-dock" type="button" onclick="toggleLogSheet(true)" aria-label="Protokoll öffnen">
    <span class="dock-ic">📜</span><span class="dock-label">Protokoll</span>
    <span class="dock-last" id="log-last">–</span>
    <span class="dock-count" id="log-count">0</span>
</button>

<script>
const SPREADSHEET_ID = '1CMCkSYRCetDYJWM9wP5QZE6kuPRrWxegoZ1kbCAp4rw';
const SAVE_KEY = 'macan_pacific_engine_v1';

let quellenList = [];
let zieleList = [];
let stateDefs = [];
let productionList = [];
let worldFlowList = [];
let systemConfig = {};
let abgelehntWords = [];
let personsList = [];
let personZoomCache = {};
let cargoSymbolMap = {};

let world = null;
let datasetSignature = '';
let simulationReady = false;
let popupBusy = false;

const REQUIRED_COLUMNS = {
    Quellen: ['ID','Rohstoff','Quelle','Quelle Detail','Quelle Grund','Trigger-Typ','Gewicht','Menge (Waggons)','Cooldown (Sessions)','Start-Offset (Session)','Bedingung','QuelleffekteProWaggon','VerfallseffekteProWaggon','Aktiv-Dauer (Sessions)','Auswahlgruppe','Ziel-IDs','Flavor-Text'],
    Ziele: ['ID','Rohstoff','Ziel','Ziel Detail','Ziel Grund','Gewicht','Bedingung','Notfallbedingung','LieferwirkungProWaggon','Zielgruppe','Quelle-IDs','Flavor-Text'],
    ZUSTAENDE: ['ID','Ort','Typ','StartMin','StartMax','Min','Max','DriftProSession','Grenzmodus','Anzeige','Beschreibung'],
    PRODUKTION: ['ID','Ort','Prioritaet','Intervall','Start-Offset','Bedingung','Effekte','MaxProSession','Flavor'],
    WELTFLUESSE: ['ID','Intervall','Start-Offset','Bedingung','Effekte','ReferenzID','Flavor'],
    SYSTEM: ['Parameter','Wert']
};

function normalizeKey(k) {
    return String(k || '').trim().toLowerCase().replace(/[\s_\-]+/g, '');
}

function getField(raw, ...candidates) {
    if (!raw) return '';
    const keys = Object.keys(raw);
    for (const cand of candidates) {
        const n = normalizeKey(cand);
        const hit = keys.find(k => normalizeKey(k) === n);
        if (hit !== undefined) return raw[hit];
    }
    return '';
}

function cleanCell(v) {
    const s = String(v ?? '').trim();
    return s === '-' ? '' : s;
}

function fetchSheetJSONP(sheetName) {
    return new Promise((resolve, reject) => {
        const cbName = 'gviz_cb_' + Math.floor(Math.random() * 1000000000);
        const script = document.createElement('script');
        let settled = false;
        const cleanup = () => {
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
        };
        const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            cleanup();
            reject(new Error(`Zeitüberschreitung beim Laden von Blatt „${sheetName}“`));
        }, 12000);

        window[cbName] = data => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (!data || data.status === 'error' || !data.table) {
                reject(new Error(`Blatt „${sheetName}“ konnte nicht gelesen werden.`));
                return;
            }
            resolve(parseGvizTable(data.table));
        };

        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${cbName}&_cb=${Date.now()}`;
        script.onerror = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            reject(new Error(`Netzwerkfehler beim Laden von „${sheetName}“`));
        };
        document.head.appendChild(script);
    });
}

function parseGvizTable(table) {
    if (!table || !Array.isArray(table.rows)) return [];
    let headers = (table.cols || []).map(c => c ? String(c.label || '').trim() : '');
    let startRowIndex = 0;
    const headerSignals = new Set(['ID', 'ROHSTOFF', 'PARAMETER']);
    const labelsLookUsable = headers.some(h => headerSignals.has(String(h || '').trim().toUpperCase()));
    if (!labelsLookUsable && table.rows.length > 0) {
        headers = (table.rows[0].c || []).map(cell => cell ? String(cell.v ?? cell.f ?? '').trim() : '');
        startRowIndex = 1;
    }
    const rows = [];
    for (let i = startRowIndex; i < table.rows.length; i++) {
        const cells = table.rows[i]?.c || [];
        const obj = {};
        let hasData = false;
        headers.forEach((header, idx) => {
            if (!header) return;
            const cell = cells[idx];
            let value = '';
            if (cell) {
                if (cell.v !== undefined && cell.v !== null) value = String(cell.v).trim();
                else if (cell.f !== undefined && cell.f !== null) value = String(cell.f).trim();
            }
            obj[header] = value;
            if (value !== '') hasData = true;
        });
        if (hasData) rows.push(obj);
    }
    return rows;
}

function assertColumns(sheetName, rows) {
    if (!rows.length) throw new Error(`Blatt „${sheetName}“ ist leer.`);
    const keys = Object.keys(rows[0]).map(k => String(k).trim());
    const present = new Set(keys);
    const missing = REQUIRED_COLUMNS[sheetName].filter(k => !present.has(k));
    if (missing.length) throw new Error(`Blatt „${sheetName}“: fehlende Spalten:${missing.join(', ')}`);
}

function parseInteger(value, label, { min = null, max = null } = {}) {
    const s = cleanCell(value);
    if (!/^-?\d+$/.test(s)) throw new Error(`${label}: ganzzahligen Wert erwartet, erhalten „${value}“`);
    const n = Number(s);
    if (!Number.isSafeInteger(n)) throw new Error(`${label}: Zahl außerhalb des gültigen Bereichs.`);
    if (min !== null && n < min) throw new Error(`${label}: muss mindestens${min} sein.`);
    if (max !== null && n > max) throw new Error(`${label}: darf höchstens ${max} sein.`);
    return n;
}

function parseNumber(value, label) {
    const s = cleanCell(value);
    if (!/^-?(?:\d+\.?\d*|\.\d+)$/.test(s)) throw new Error(`${label}: Zahl erwartet, erhalten „${value}“`);
    const n = Number(s);
    if (!Number.isFinite(n)) throw new Error(`${label}: ungültige Zahl.`);
    return n;
}

function parseIdList(value, label = 'ID-Liste') {
    const s = cleanCell(value);
    if (!s) return [];
    const ids = s.split(',').map(v => v.trim().toUpperCase()).filter(Boolean);
    const seen = new Set();
    ids.forEach(id => {
        if (seen.has(id)) throw new Error(`${label}: doppelte Referenz${id}.`);
        seen.add(id);
    });
    return ids;
}

function parsePersonRules(value, knownStateIds, label = 'Personen') {
    const s = cleanCell(value);
    if (!s) return [];
    return s.split(';').map(part => {
        const token = part.trim();
        if (!token) throw new Error(`${label}: leerer Eintrag.`);
        const cut = token.indexOf('?');
        const id = (cut < 0 ? token : token.slice(0, cut)).trim().toUpperCase();
        if (!/^P[0-9]+$/.test(id)) throw new Error(`${label}: ungültige Personen-ID „${id}“.`);
        const condRaw = cut < 0 ? '' : token.slice(cut + 1).trim();
        if (cut >= 0 && !condRaw) throw new Error(`${label}: Bedingung nach ? fehlt.`);
        return { id, condition: parseCondition(condRaw, knownStateIds) };
    });
}

function assertUniqueIds(rows, sheetName) {
    const seen = new Set();
    rows.forEach((r, idx) => {
        const id = String(getField(r, 'ID') || '').trim().toUpperCase();
        if (!id) throw new Error(`${sheetName}, Zeile${idx + 2}: ID fehlt.`);
        if (seen.has(id)) throw new Error(`${sheetName}: doppelte ID${id}.`);
        seen.add(id);
    });
}

function assertIdPattern(rows, prefix, sheetName) {
    const bad = rows.map(r => String(getField(r,'ID') || '').trim().toUpperCase()).filter(id => !new RegExp(`^${prefix}[0-9]+$`).test(id));
    if (bad.length) throw new Error(`${sheetName}: ungültige IDs: ${bad.join(', ')}.`);
}

function parseCondition(expression, knownStateIds) {
    const raw = cleanCell(expression);
    if (!raw) return { raw: '', groups: [] };
    if (/[()]/.test(raw)) throw new Error(`Bedingung „${raw}“: Klammern sind nicht erlaubt.`);
    const orParts = raw.split('|');
    if (orParts.some(p => !p.trim())) throw new Error(`Bedingung „${raw}“: leerer ODER-Teil.`);
    const groups = orParts.map(orPart => {
        const andParts = orPart.split('&');
        if (andParts.some(p => !p.trim())) throw new Error(`Bedingung „${raw}“: leerer UND-Teil.`);
        return andParts.map(token => {
            const m = token.trim().match(/^([A-Z0-9_]+)\s*(<=|>=|!=|=|<|>)\s*(-?(?:\d+\.?\d*|\.\d+))$/i);
            if (!m) throw new Error(`Ungültiger Vergleich „${token.trim()}“ in Bedingung „${raw}“.`);
            const stateId = m[1].toUpperCase();
            if (!knownStateIds.has(stateId)) throw new Error(`Bedingung „${raw}“ verweist auf unbekannten Zustand ${stateId}.`);
            return { stateId, op: m[2], value: Number(m[3]) };
        });
    });
    return { raw, groups };
}

function conditionTrue(cond, values) {
    if (!cond || !cond.groups || cond.groups.length === 0) return true;
    const cmp = (left, op, right) => {
        if (op === '<') return left < right;
        if (op === '<=') return left <= right;
        if (op === '=') return left === right;
        if (op === '!=') return left !== right;
        if (op === '>=') return left >= right;
        if (op === '>') return left > right;
        return false;
    };
    return cond.groups.some(group => group.every(c => cmp(Number(values[c.stateId]), c.op, c.value)));
}

function parseEffects(expression, knownStateIds) {
    const raw = cleanCell(expression);
    if (!raw) return {};
    const out = {};
    raw.split(';').forEach(token => {
        const t = token.trim();
        if (!t) throw new Error(`Effekt „${raw}“ enthält einen leeren Teil.`);
        const m = t.match(/^([A-Z0-9_]+)\s*([+-])\s*((?:\d+\.?\d*|\.\d+))$/i);
        if (!m) throw new Error(`Ungültiger Effekt „${t}“ in „${raw}“.`);
        const stateId = m[1].toUpperCase();
        if (!knownStateIds.has(stateId)) throw new Error(`Effekt „${raw}“ verweist auf unbekannten Zustand ${stateId}.`);
        const amount = Number(m[3]) * (m[2] === '-' ? -1 : 1);
        out[stateId] = (out[stateId] || 0) + amount;
    });
    return out;
}

function mergeEffects(...effectsList) {
    const out = {};
    effectsList.forEach(effects => {
        Object.entries(effects || {}).forEach(([id, value]) => {
            out[id] = (out[id] || 0) + Number(value || 0);
        });
    });
    Object.keys(out).forEach(id => {
        if (Math.abs(out[id]) < 1e-12) delete out[id];
    });
    return out;
}

function scaleEffects(effects, factor) {
    const out = {};
    Object.entries(effects || {}).forEach(([id, value]) => out[id] = value * factor);
    return out;
}

function normalizeData(rawSheets) {
    Object.entries(REQUIRED_COLUMNS).forEach(([name]) => assertColumns(name, rawSheets[name]));
    assertUniqueIds(rawSheets.Quellen, 'Quellen');
    assertUniqueIds(rawSheets.Ziele, 'Ziele');
    assertUniqueIds(rawSheets.ZUSTAENDE, 'ZUSTAENDE');
    assertUniqueIds(rawSheets.PRODUKTION, 'PRODUKTION');
    assertUniqueIds(rawSheets.WELTFLUESSE, 'WELTFLUESSE');
    assertIdPattern(rawSheets.Quellen, 'Q', 'Quellen');
    assertIdPattern(rawSheets.Ziele, 'Z', 'Ziele');

    stateDefs = rawSheets.ZUSTAENDE.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const startMin = parseInteger(getField(r,'StartMin'), `${id}.StartMin`);
        const startMax = parseInteger(getField(r,'StartMax'), `${id}.StartMax`);
        const min = parseNumber(getField(r,'Min'), `${id}.Min`);
        const max = parseNumber(getField(r,'Max'), `${id}.Max`);
        const drift = parseNumber(getField(r,'DriftProSession'), `${id}.DriftProSession`);
        const boundaryMode = cleanCell(getField(r,'Grenzmodus'));
        if (!['Strikt','Klemmen'].includes(boundaryMode)) throw new Error(`${id}: Grenzmodus muss Strikt oder Klemmen sein.`);
        if (startMin > startMax || min > max || startMin < min || startMax > max) throw new Error(`${id}: Start-/Grenzwerte sind widersprüchlich.`);
        return {
            id,
            ort: cleanCell(getField(r,'Ort')),
            typ: cleanCell(getField(r,'Typ')),
            startMin, startMax, min, max, drift,
            boundaryMode,
            display: cleanCell(getField(r,'Anzeige')).toLowerCase() === 'ja',
            description: cleanCell(getField(r,'Beschreibung')),
            kurz: cleanCell(getField(r,'Kurzname', 'Kurz name', 'Name'))
        };
    });

    const stateIds = new Set(stateDefs.map(s => s.id));

    quellenList = rawSheets.Quellen.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const triggerType = cleanCell(getField(r,'Trigger-Typ'));
        if (!['Regel','Zufall','Notfall','INTERN'].includes(triggerType)) throw new Error(`${id}: unbekannter Trigger-Typ „${triggerType}“.`);
        return {
            id,
            rohstoff: cleanCell(getField(r,'Rohstoff')),
            ort: cleanCell(getField(r,'Quelle')),
            detail: cleanCell(getField(r,'Quelle Detail')),
            grund: cleanCell(getField(r,'Quelle Grund')),
            triggerType,
            gewicht: parseNumber(getField(r,'Gewicht'), `${id}.Gewicht`),
            menge: parseInteger(getField(r,'Menge (Waggons)'), `${id}.Menge`, { min: 0 }),
            cooldown: parseInteger(getField(r,'Cooldown (Sessions)'), `${id}.Cooldown`, { min: 0 }),
            startOffset: parseInteger(getField(r,'Start-Offset (Session)'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            sourceEffects: parseEffects(getField(r,'QuelleffekteProWaggon'), stateIds),
            expiryEffects: parseEffects(getField(r,'VerfallseffekteProWaggon'), stateIds),
            activeDuration: parseInteger(getField(r,'Aktiv-Dauer (Sessions)'), `${id}.Aktiv-Dauer`, { min: 0 }),
            selectionGroup: cleanCell(getField(r,'Auswahlgruppe')) || id,
            allowedTargetIds: parseIdList(getField(r,'Ziel-IDs'), `${id}.Ziel-IDs`),
            flavorText: cleanCell(getField(r,'Flavor-Text')),
            personRules: parsePersonRules(getField(r,'Personen'), stateIds, `${id}.Personen`),
            counterPersonRules: parsePersonRules(getField(r,'Gegenstimme'), stateIds, `${id}.Gegenstimme`),
            successText: cleanCell(getField(r,'Flavor-Erfüllt', 'Flavor erfüllt')),
            failText: cleanCell(getField(r,'Flavor-Abgelehnt', 'Flavor abgelehnt'))
        };
    });

    zieleList = rawSheets.Ziele.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        return {
            id,
            rohstoff: cleanCell(getField(r,'Rohstoff')),
            ort: cleanCell(getField(r,'Ziel')),
            detail: cleanCell(getField(r,'Ziel Detail')),
            grund: cleanCell(getField(r,'Ziel Grund')),
            gewicht: parseNumber(getField(r,'Gewicht'), `${id}.Gewicht`),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            emergencyCondition: parseCondition(getField(r,'Notfallbedingung'), stateIds),
            deliveryEffects: parseEffects(getField(r,'LieferwirkungProWaggon'), stateIds),
            targetGroup: cleanCell(getField(r,'Zielgruppe')) || id,
            allowedSourceIds: parseIdList(getField(r,'Quelle-IDs'), `${id}.Quelle-IDs`),
            flavorText: cleanCell(getField(r,'Flavor-Text')),
            personRules: parsePersonRules(getField(r,'Personen'), stateIds, `${id}.Personen`),
            counterPersonRules: parsePersonRules(getField(r,'Gegenstimme'), stateIds, `${id}.Gegenstimme`),
            successText: cleanCell(getField(r,'Flavor-Erfüllt', 'Flavor erfüllt')),
            failText: cleanCell(getField(r,'Flavor-Abgelehnt', 'Flavor abgelehnt'))
        };
    });

    const qById = Object.fromEntries(quellenList.map(q => [q.id, q]));
    const zById = Object.fromEntries(zieleList.map(z => [z.id, z]));
    quellenList.forEach(q => {
        if (q.gewicht < 0) throw new Error(`${q.id}: Gewicht darf nicht negativ sein.`);
        if (q.triggerType !== 'INTERN') {
            if (q.gewicht <= 0) throw new Error(`${q.id}: transportfähige Quelle braucht ein positives Gewicht.`);
            if (q.menge < 1) throw new Error(`${q.id}: transportfähige Quelle braucht mindestens 1 Waggon.`);
            if (q.activeDuration < 1) throw new Error(`${q.id}: transportfähige Quelle braucht eine Aktiv-Dauer von mindestens 1 Session.`);
            if (!q.allowedTargetIds.length) throw new Error(`${q.id}: transportfähige Quelle hat keine Ziel-IDs.`);
        }
        q.allowedTargetIds.forEach(zid => {
            const z = zById[zid];
            if (!z) throw new Error(`${q.id}: unbekannte Ziel-ID${zid}.`);
            if (!z.allowedSourceIds.includes(q.id)) throw new Error(`${q.id} ↔${zid}: Verbindung ist nicht auf beiden Seiten eingetragen.`);
            if (q.rohstoff !== z.rohstoff) throw new Error(`${q.id} ↔${zid}: Rohstoff stimmt nicht überein (${q.rohstoff} /${z.rohstoff}).`);
            if (q.triggerType === 'Notfall' && !z.emergencyCondition.raw) throw new Error(`${q.id} ↔${zid}: Notfallquelle benötigt am Ziel eine Notfallbedingung.`);
        });
    });
    zieleList.forEach(z => {
        if (z.gewicht <= 0) throw new Error(`${z.id}: Ziel braucht ein positives Gewicht.`);
        if (!z.allowedSourceIds.length) throw new Error(`${z.id}: Ziel hat keine Quelle-IDs.`);
        z.allowedSourceIds.forEach(qid => {
            const q = qById[qid];
            if (!q) throw new Error(`${z.id}: unbekannte Quelle-ID${qid}.`);
            if (!q.allowedTargetIds.includes(z.id)) throw new Error(`${qid} ↔${z.id}: Verbindung ist nicht auf beiden Seiten eingetragen.`);
        });
    });

    const groupMap = {};
    quellenList.filter(q => q.triggerType !== 'INTERN').forEach(q => {
        const g = groupMap[q.selectionGroup] || (groupMap[q.selectionGroup] = []);
        g.push(q);
    });
    Object.entries(groupMap).forEach(([groupId, qs]) => {
        const cooldowns = new Set(qs.map(q => q.cooldown));
        const offsets = new Set(qs.map(q => q.startOffset));
        if (cooldowns.size > 1 || offsets.size > 1) throw new Error(`Auswahlgruppe ${groupId}: Varianten müssen denselben Cooldown und Start-Offset haben.`);
    });

    productionList = rawSheets.PRODUKTION.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        return {
            id,
            ort: cleanCell(getField(r,'Ort')),
            priority: parseInteger(getField(r,'Prioritaet'), `${id}.Prioritaet`),
            interval: parseInteger(getField(r,'Intervall'), `${id}.Intervall`, { min: 1 }),
            startOffset: parseInteger(getField(r,'Start-Offset'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            effects: parseEffects(getField(r,'Effekte'), stateIds),
            maxPerSession: parseInteger(getField(r,'MaxProSession'), `${id}.MaxProSession`, { min: 1 }),
            flavor: cleanCell(getField(r,'Flavor'))
        };
    });

    worldFlowList = rawSheets.WELTFLUESSE.map(r => {
        const id = String(getField(r,'ID')).trim().toUpperCase();
        const referenceId = cleanCell(getField(r,'ReferenzID')).toUpperCase();
        if (referenceId && !qById[referenceId]) throw new Error(`${id}: ReferenzID${referenceId} existiert nicht.`);
        return {
            id,
            interval: parseInteger(getField(r,'Intervall'), `${id}.Intervall`, { min: 1 }),
            startOffset: parseInteger(getField(r,'Start-Offset'), `${id}.Start-Offset`, { min: 1 }),
            condition: parseCondition(getField(r,'Bedingung'), stateIds),
            effects: parseEffects(getField(r,'Effekte'), stateIds),
            referenceId,
            flavor: cleanCell(getField(r,'Flavor')),
            personRules: parsePersonRules(getField(r,'Personen'), stateIds, `${id}.Personen`),
            counterPersonRules: parsePersonRules(getField(r,'Gegenstimme'), stateIds, `${id}.Gegenstimme`)
        };
    });

    systemConfig = {};
    rawSheets.SYSTEM.forEach((r, idx) => {
        const parameter = cleanCell(getField(r,'Parameter'));
        const value = String(getField(r,'Wert') ?? '').trim();
        if (!parameter) throw new Error(`SYSTEM Zeile ${idx + 2}: Parameter fehlt.`);
        if (!value) throw new Error(`SYSTEM.${parameter}: Wert fehlt.`);
        if (Object.prototype.hasOwnProperty.call(systemConfig, parameter)) throw new Error(`SYSTEM: doppelter Parameter ${parameter}.`);
        systemConfig[parameter] = value;
    });

    const requiredParams = [
        'SchemaVersion','MaxAktiveAuftraege','MaxNeueAuftraegeProSession','AgingProSession','OrtAgingProSession',
        'OrtsausgleichAbSessions','ZufallsbevorzugungAbSessions','ZufallsGewichtsfaktor','NotfallGewichtsfaktor','CooldownJitter',
        'Startzustand','Persistenz','OfflineFortschritt','PauseReset','Transportmenge','EffekteSkalierung','Auswahl',
        'MaxAktivProQGruppe','MaxAktivProZielgruppe','Bedingung_AND','Bedingung_OR','LeeresFeld','Ketten',
        'Produktionsreihenfolge','Weltflussreihenfolge','TimerNachFehlversuch','CooldownStart','Angebotsablauf','SessionAblauf'
    ];
    requiredParams.forEach(p => { if (!(p in systemConfig)) throw new Error(`SYSTEM: Parameter ${p} fehlt.`); });

    systemConfig.SchemaVersion = String(systemConfig.SchemaVersion).trim();
    if (systemConfig.SchemaVersion !== '1') throw new Error(`SYSTEM.SchemaVersion ${systemConfig.SchemaVersion} wird von dieser Engine nicht unterstützt.`);

    ['MaxAktiveAuftraege','MaxAktivProQGruppe','MaxAktivProZielgruppe'].forEach(p => systemConfig[p] = parseInteger(systemConfig[p], `SYSTEM.${p}`, { min: 1 }));
    ['MaxNeueAuftraegeProSession','AgingProSession','OrtAgingProSession','OrtsausgleichAbSessions','ZufallsbevorzugungAbSessions','CooldownJitter'].forEach(p => systemConfig[p] = parseInteger(systemConfig[p], `SYSTEM.${p}`, { min: 0 }));
    ['ZufallsGewichtsfaktor','NotfallGewichtsfaktor'].forEach(p => {
        systemConfig[p] = parseNumber(systemConfig[p], `SYSTEM.${p}`);
        if (systemConfig[p] <= 0) throw new Error(`SYSTEM.${p}: muss größer als 0 sein.`);
    });

    const requiredLiterals = {
        Startzustand: 'ZufallGanzzahlig',
        Persistenz: 'NachJederAktion',
        OfflineFortschritt: 'NEIN',
        PauseReset: 'NEIN',
        Transportmenge: 'NurQ',
        EffekteSkalierung: 'ProWaggon',
        Auswahl: 'QGruppeDannZielgruppeDannVariante',
        Bedingung_AND: '&',
        Bedingung_OR: '|',
        LeeresFeld: '-',
        Ketten: 'NichtInVersion1',
        Produktionsreihenfolge: 'PrioritaetDannID',
        Weltflussreihenfolge: 'ID',
        TimerNachFehlversuch: 'NaechsterIntervall',
        CooldownStart: 'BeiAngebot',
        Angebotsablauf: 'FreigabeUndVerfallseffekte',
        SessionAblauf: 'Verfall>Weltfluesse>Produktion>Drift>Auswahl'
    };
    Object.entries(requiredLiterals).forEach(([p, expected]) => {
        if (systemConfig[p] !== expected) throw new Error(`SYSTEM.${p}: "${systemConfig[p]}" wird in Schema 1 nicht unterstützt; erwartet "${expected}".`);
    });

    const q25 = qById.Q25;
    if (!q25 || q25.triggerType !== 'INTERN') throw new Error('Q25 muss als Referenzkarte mit Trigger-Typ INTERN vorhanden sein.');
    if (q25.menge !== 0 || q25.allowedTargetIds.length || Object.keys(q25.sourceEffects).length || Object.keys(q25.expiryEffects).length) {
        throw new Error('Q25 darf keine Transportmenge, Zielverbindungen oder Transport-/Verfallseffekte besitzen.');
    }
    const q25Refs = worldFlowList.filter(w => w.referenceId === 'Q25');
    if (q25Refs.length !== 1 || q25Refs[0].id !== 'PV_TANKER') throw new Error('Q25 darf genau einmal und ausschließlich von WELTFLUESSE.PV_TANKER referenziert werden.');

    return { qById, zById };
}


let scenarioList = [], kassenList = [], gabelungList = [];
let metaOpen = false, forkNote = '';

function sheetHasCols(rows, cols) {
    return Array.isArray(rows) && rows.length > 0 && cols.every(c => Object.keys(rows[0]).some(k => normalizeKey(k) === normalizeKey(c)));
}
function parseWeights(value, groupSet, label) {
    const raw = cleanCell(value), out = {};
    if (!raw) return out;
    raw.split(';').forEach(tok => {
        const m = tok.trim().match(/^([^:\s]+)\s*:\s*(\d+\.?\d*)$/);
        if (!m) throw new Error(`${label}: ungültiger Gewichtseintrag „${tok.trim()}“ (erwartet GRUPPE:Faktor).`);
        if (!groupSet.has(m[1])) throw new Error(`${label}: unbekannte Auswahlgruppe ${m[1]}.`);
        out[m[1]] = Number(m[2]);
    });
    return out;
}
function parseGroupList(value, groupSet, label) {
    const ids = cleanCell(value).split(',').map(v => v.trim()).filter(Boolean);
    ids.forEach(g => { if (!groupSet.has(g)) throw new Error(`${label}: unbekannte Auswahlgruppe ${g}.`); });
    return ids;
}

function normalizeExtras(raw) {
    const stateIds = new Set(stateDefs.map(s => s.id));
    const groupSet = new Set(quellenList.filter(q => q.triggerType !== 'INTERN').map(q => q.selectionGroup));
    scenarioList = []; kassenList = []; gabelungList = [];
    if (sheetHasCols(raw.SZENARIEN, ['ID', 'Name'])) {

                startEffects: parseEffects(getField(r, 'Startwerte'), stateIds),

                flavor: cleanCell(getField(r, 'Flavor-Text', 'Flavor')), personId: cleanCell(getField(r, 'Personen')).toUpperCase()
            };

                condition: parseCondition(getField(r, 'Bedingung'), stateIds),
                ab: ab ? parseInteger(ab, `KASSENSTURZ.${id}.Ab`, { min: 1 }) : 1,
                bis: bis ? parseInteger(bis, `KASSENSTURZ.${id}.Bis`, { min: 1 }) : 99999,

                announceText: cleanCell(getField(r, 'Flavor-Ankündigung', 'Flavor-Ankuendigung')),

                sideB: parseGroupList(getField(r, 'Seite B'), groupSet, `GABELUNGEN.${id}.Seite B`), flavor: cleanCell(getField(r, 'Flavor-Text', 'Flavor')) };
        });
