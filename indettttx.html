}

function kassInterval() { const n = Number(systemConfig.KassensturzIntervall); return Number.isFinite(n) && n >= 2 ? Math.floor(n) : 4; }
function drawKassensturz(day) {
    const picks = {};
    [...new Set(kassenList.map(r => r.pruefer))].forEach(pr => {
        const pool = kassenList.filter(r => r.pruefer === pr && day >= r.ab && day <= r.bis);
        if (pool.length) picks[pr] = pool[randomIntInclusive(0, pool.length - 1)].id;
    });
    return { day, picks };
}
function stateLabel(id) {
    const d = stateDef(id); if (!d) return id;
    if (d.kurz) return d.kurz;
    const t = String(d.description || '').split(/[;.(]/)[0].trim();
    return (t || id).slice(0, 26);
}
function applySoft(effects, values = world.values, withReservations = true) {
    const res = withReservations ? totalReservations() : {};
    Object.entries(effects || {}).forEach(([id, d]) => {
        const def = stateDef(id); if (!def) return;
        const r = res[id] || { out: 0, in: 0 };
        const lo = def.min + Number(r.out || 0), hi = def.max - Number(r.in || 0);
        const cur = Number(values[id]);
        let next = Math.min(hi, Math.max(lo, cur + Number(d)));
        if ((d < 0 && next > cur) || (d > 0 && next < cur)) next = cur;
        values[id] = next;
    });
}
function scenarioFactor(groupId) {
    const sc = scenarioList.find(x => x.id === world.scenarioId);
    return sc && sc.weights[groupId] ? sc.weights[groupId] : 1;
}
function pickScenarioId() {
    if (!scenarioList.length) return null;
    let last = null; try { last = localStorage.getItem('macan_last_scenario'); } catch (_) {}
    const pool = scenarioList.length > 1 ? scenarioList.filter(x => x.id !== last) : scenarioList;
    const id = pool[randomIntInclusive(0, pool.length - 1)].id;
    try { localStorage.setItem('macan_last_scenario', id); } catch (_) {}
    return id;
}
function announceScenario() {
    if (!world || !world.scenarioId || world.scenarioShown) return;
    const sc = scenarioList.find(x => x.id === world.scenarioId); if (!sc) return;
    world.scenarioShown = true; saveWorld();
    log(`Szenario <b>${escapeHtml(sc.name)}</b>: ${escapeHtml(sc.beschreibung)}`);
    if (sc.flavor) announce(personById(sc.personId), sc.flavor, `Szenario: ${sc.name}`);
}
function kassStatus() {
    const k = world && world.kass; if (!k) return [];
    return Object.values(k.picks).map(id => kassenList.find(r => r.id === id)).filter(Boolean)
        .map(row => ({ row, ok: conditionTrue(row.condition, world.values) }));
}
function runKassensturz() {
    const k = world.kass;
    if (!k || world.session < k.day) return;
    world.kassHistory = world.kassHistory || [];
    kassStatus().forEach(({ row, ok }) => {
        applySoft(ok ? row.reward : row.penalty);
        world.kassHistory.push({ day: k.day, id: row.id, ok });
        const person = personById(row.pruefer);
        log(`Kassensturz S${k.day} · ${escapeHtml(person ? person.name : row.pruefer)}: ${escapeHtml(row.titel)} – ${ok ? 'bestanden' : 'verfehlt'}.`, !ok);
        announce(person, ok ? (row.okText || 'Bestanden.') : (row.failText || 'Verfehlt.'), `Kassensturz S${k.day} · ${row.titel} · ${ok ? 'bestanden ✓' : 'verfehlt ✕'}`);
    });
    world.kass = drawKassensturz(k.day + kassInterval());
}

function forkRuleFor(groupId) { return gabelungList.find(g => g.sideA.includes(groupId) || g.sideB.includes(groupId)); }
function forkOthers(rule, groupId) { return rule.sideA.includes(groupId) ? rule.sideB : rule.sideA; }
function linkFork(a, b, rule) { a.forkId = b.id; b.forkId = a.id; a.forkRule = b.forkRule = rule.id; }
function unlinkFork(task) {
    if (!task || !task.forkId) return;
    const partner = world.activeTasks.find(t => t.id === task.forkId);
    if (partner) { partner.forkId = null; partner.forkRule = null; }
    task.forkId = null;
}
function tryFork(task) {
    const rule = forkRuleFor(task.selectionGroup); if (!rule) return;
    const others = forkOthers(rule, task.selectionGroup);
    const existing = world.activeTasks.find(t => t.id !== task.id && !t.forkId && others.includes(t.selectionGroup));
    if (existing) { linkFork(task, existing, rule); return; }
    if (world.activeTasks.length >= systemConfig.MaxAktiveAuftraege) return;
    const combos = buildEligibleCombinations().filter(c => others.includes(c.q.selectionGroup));
    if (!combos.length) return;
    const chosen = chooseCombination(combos, { locationPriorityConsumed: true });
    if (!chosen || !createTaskFromCombo(chosen.combo)) return;
    linkFork(task, world.activeTasks[world.activeTasks.length - 1], rule);
}
function resolveFork(done) {
    if (!done.forkId) return;
    const p = world.activeTasks.find(t => t.id === done.forkId);
    done.forkId = null;
    if (!p) return;
    world.activeTasks = world.activeTasks.filter(t => t.id !== p.id);
    if (!applyTransaction(p.expiryEffects)) applySoft(p.expiryEffects);
    const qq = qById(p.qId), zz = zById(p.zId);
    forkNote = `${p.rohstoff} (${qq ? qq.ort : '?'} → ${zz ? zz.ort : '?'}) verfällt`;
    log(`Gabelung: <b>${p.qId}➔${p.zId}</b> (${escapeHtml(p.rohstoff)}) verfällt, weil <b>${done.qId}➔${done.zId}</b> erfüllt wurde${Object.keys(p.expiryEffects).length ? ' – Verfallseffekte gebucht' : ''}.`, true);
}

function stableHash(value) {
    const str = JSON.stringify(value);
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
}

function makeDatasetSignature() {
    return `${systemConfig.SchemaVersion}:${stableHash({quellenList, zieleList, stateDefs, productionList, worldFlowList, systemConfig, scenarioList, kassenList, gabelungList})}`;
}

function randomIntInclusive(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function initialWorld() {
    const values = {};
    stateDefs.forEach(s => values[s.id] = randomIntInclusive(s.startMin, s.startMax));
    const scenarioId = pickScenarioId();
    const sc = scenarioList.find(x => x.id === scenarioId);
    if (sc) applySoft(sc.startEffects, values, false);
    const kass = kassenList.length ? drawKassensturz(kassInterval()) : null;
    const groupTimers = {};
    const groupAging = {};
    const groups = new Map();
    quellenList.filter(q => q.triggerType !== 'INTERN').forEach(q => {
        if (!groups.has(q.selectionGroup)) groups.set(q.selectionGroup, q);
    });
    groups.forEach((q, groupId) => {
        groupTimers[groupId] = q.startOffset;
        groupAging[groupId] = 0;
    });
    const visitTimes = {};
    const places = new Set();
    quellenList.forEach(q => { if (q.ort) places.add(q.ort); });
    zieleList.forEach(z => { if (z.ort) places.add(z.ort); });
    places.forEach(place => visitTimes[place] = 0);
    return {
        schemaVersion: systemConfig.SchemaVersion,
        datasetSignature,
        session: 1,
        values,
        activeTasks: [],
        groupTimers,
        groupAging,
        visitTimes,
        lastRandomCreated: 0,
        fahrplanUsed: 0,
        scenarioId, scenarioShown: false, kass, kassHistory: [],
        nextTaskSerial: 1,
        createdAt: Date.now(),
        updatedAt: Date.now()
    };
}

function saveWorld() {
    if (!world) return;
    world.updatedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(world));
}

function loadWorldOrInitialize() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    let saved;
    try { saved = JSON.parse(raw); }
    catch (_) {
        const ok = confirm('Der gespeicherte Spielstand ist beschädigt. Kompletten Neustart durchführen?');
        if (!ok) return false;
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    if (saved.datasetSignature !== datasetSignature || saved.schemaVersion !== systemConfig.SchemaVersion) {
        const ok = confirm('Die Tabellen bzw. die Schema-Version haben sich seit dem gespeicherten Spielstand geändert. Alte aktive Aufträge dürfen nicht still mit neuen Effekten weiterlaufen. Kompletten Neustart mit den aktuellen Daten durchführen?');
        if (!ok) {
            showFatal('Datensatz geändert. Der alte Spielstand wurde nicht geladen. Bitte Tabellen zurücksetzen oder den bestätigten Neustart ausführen.');
            return false;
        }
        world = initialWorld();
        runSessionPhases({ includeExpiry: false });
        saveWorld();
        return true;
    }
    world = saved;
    validateLoadedWorld();
    return true;
}

function numericMapsEqual(a, b) {
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for (const key of keys) {
        if (Math.abs(Number(a?.[key] || 0) - Number(b?.[key] || 0)) > 1e-9) return false;
    }
    return true;
}

function reservationsEqual(a, b) {
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for (const key of keys) {
        const ar = a?.[key] || { out: 0, in: 0 };
        const br = b?.[key] || { out: 0, in: 0 };
        if (Math.abs(Number(ar.out || 0) - Number(br.out || 0)) > 1e-9) return false;
        if (Math.abs(Number(ar.in || 0) - Number(br.in || 0)) > 1e-9) return false;
    }
    return true;
}

function expectedSelectionGroups() {
    return [...new Set(quellenList.filter(q => q.triggerType !== 'INTERN').map(q => q.selectionGroup))];
}

function expectedVisitPlaces() {
    return [...new Set([...quellenList.map(q => q.ort), ...zieleList.map(z => z.ort)].filter(Boolean))];
}

function validateLoadedWorld() {
    if (!world || typeof world !== 'object') throw new Error('Spielstand: ungültiges Wurzelobjekt.');
    if (!Number.isInteger(world.session) || world.session < 1) throw new Error('Spielstand: ungültige Sessionnummer.');
    if (!world.values || typeof world.values !== 'object' || Array.isArray(world.values)) throw new Error('Spielstand: Zustände fehlen.');

    const stateIds = new Set(stateDefs.map(s => s.id));
    stateDefs.forEach(s => {
        if (!Object.prototype.hasOwnProperty.call(world.values, s.id)) throw new Error(`Spielstand: Zustand ${s.id} fehlt.`);
        const value = Number(world.values[s.id]);
        if (!Number.isFinite(value)) throw new Error(`Spielstand: Zustand ${s.id} ist keine gültige Zahl.`);
        if (value < s.min - 1e-9 || value > s.max + 1e-9) throw new Error(`Spielstand: Zustand ${s.id} liegt außerhalb seiner Grenzen.`);
    });
    Object.keys(world.values).forEach(id => {
        if (!stateIds.has(id)) throw new Error(`Spielstand: unbekannter Zustand ${id}.`);
    });

    const groups = expectedSelectionGroups();
    const groupSet = new Set(groups);
    for (const field of ['groupTimers','groupAging']) {
        const obj = world[field];
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error(`Spielstand: ${field} fehlt.`);
        groups.forEach(groupId => {
            if (!Object.prototype.hasOwnProperty.call(obj, groupId)) throw new Error(`Spielstand: ${field}.${groupId} fehlt.`);
            const value = Number(obj[groupId]);
            if (!Number.isFinite(value) || value < 0) throw new Error(`Spielstand: ${field}.${groupId} ist ungültig.`);
            if (field === 'groupTimers' && !Number.isInteger(value)) throw new Error(`Spielstand: ${field}.${groupId} muss ganzzahlig sein.`);
        });
        Object.keys(obj).forEach(groupId => { if (!groupSet.has(groupId)) throw new Error(`Spielstand: unbekannte Q-Gruppe ${groupId} in${field}.`); });
    }

    const places = expectedVisitPlaces();
    const placeSet = new Set(places);
    if (!world.visitTimes || typeof world.visitTimes !== 'object' || Array.isArray(world.visitTimes)) throw new Error('Spielstand: Besuchszeiten fehlen.');
    places.forEach(place => {
        if (!Object.prototype.hasOwnProperty.call(world.visitTimes, place)) throw new Error(`Spielstand: Besuchszeit für ${place} fehlt.`);
        const value = Number(world.visitTimes[place]);
        if (!Number.isInteger(value) || value < 0 || value > world.session) throw new Error(`Spielstand: Besuchszeit für ${place} ist ungültig.`);
    });
    Object.keys(world.visitTimes).forEach(place => { if (!placeSet.has(place)) throw new Error(`Spielstand: unbekannter Ort ${place} in Besuchszeiten.`); });

    if (!Number.isInteger(world.lastRandomCreated) || world.lastRandomCreated < 0 || world.lastRandomCreated > world.session) throw new Error('Spielstand: letzter Zufallszeitpunkt ist ungültig.');
    if (!Number.isInteger(world.nextTaskSerial) || world.nextTaskSerial < 1) throw new Error('Spielstand: nextTaskSerial ist ungültig.');
    if (!Array.isArray(world.activeTasks)) throw new Error('Spielstand: activeTasks fehlt.');

    const taskIds = new Set();
    const qGroupCounts = {};
    const zGroupCounts = {};
    world.activeTasks.forEach(t => {
        if (!t || typeof t !== 'object' || !t.id || taskIds.has(t.id)) throw new Error(`Spielstand: ungültige oder doppelte Auftrags-ID ${t?.id || '?'}.`);
        taskIds.add(t.id);
        const q = qById(t.qId);
        const z = zById(t.zId);
        if (!q || !z) throw new Error(`Spielstand: Auftrag ${t.id} verweist auf unbekannte Q/Z-ID.`);
        if (q.triggerType === 'INTERN' || !q.allowedTargetIds.includes(z.id) || !z.allowedSourceIds.includes(q.id) || q.rohstoff !== z.rohstoff) throw new Error(`Spielstand: Auftrag ${t.id} enthält keine gültige Q/Z-Verbindung.`);
        if (!Number.isInteger(t.createdSession) || t.createdSession < 1 || t.createdSession > world.session) throw new Error(`Spielstand: Auftrag ${t.id} hat eine ungültige Erzeugungs-Session.`);
        if (!Number.isInteger(t.activeDuration) || t.activeDuration < 1 || t.activeDuration !== q.activeDuration) throw new Error(`Spielstand: Auftrag ${t.id} hat eine ungültige Aktiv-Dauer.`);
        if (t.selectionGroup !== q.selectionGroup || t.targetGroup !== z.targetGroup || t.triggerType !== q.triggerType) throw new Error(`Spielstand: Auftrag ${t.id} enthält inkonsistente Gruppendaten.`);
        if (Number(t.menge) !== transportQuantity(q, z)) throw new Error(`Spielstand: Auftrag ${t.id} enthält eine inkonsistente Waggonzahl.`);
        const expected = buildPairSnapshot(q, z);
        if (!numericMapsEqual(t.fulfillmentEffects, expected.fulfillmentEffects) || !numericMapsEqual(t.expiryEffects, expected.expiryEffects) || !reservationsEqual(t.reservation, expected.reservation)) {
            throw new Error(`Spielstand: Auftrag ${t.id} enthält Effekte/Reservierungen, die nicht zum gespeicherten Datensatz passen.`);
        }
        qGroupCounts[t.selectionGroup] = (qGroupCounts[t.selectionGroup] || 0) + 1;
        zGroupCounts[t.targetGroup] = (zGroupCounts[t.targetGroup] || 0) + 1;
    });
    Object.entries(qGroupCounts).forEach(([groupId, count]) => {
        if (count > systemConfig.MaxAktivProQGruppe) throw new Error(`Spielstand: Q-Gruppe ${groupId} überschreitet MaxAktivProQGruppe.`);
    });
    Object.entries(zGroupCounts).forEach(([groupId, count]) => {
        if (count > systemConfig.MaxAktivProZielgruppe) throw new Error(`Spielstand: Zielgruppe ${groupId} überschreitet MaxAktivProZielgruppe.`);
    });
    if (world.activeTasks.length > systemConfig.MaxAktiveAuftraege) throw new Error('Spielstand: mehr aktive Aufträge als MaxAktiveAuftraege.');

    const reservations = totalReservations();
    stateDefs.filter(s => s.boundaryMode === 'Strikt').forEach(s => {
        const r = reservations[s.id] || { out: 0, in: 0 };
        const cur = Number(world.values[s.id]);
        if (cur - s.min < Number(r.out || 0) - 1e-9 || s.max - cur < Number(r.in || 0) - 1e-9) {
            throw new Error(`Spielstand: Reservierungen für ${s.id} sind mit dem aktuellen Zustand nicht erfüllbar.`);
        }
    });
}

function stateDef(id) {
    return stateDefs.find(s => s.id === id);
}

function totalReservations(excludeTaskId = null) {
    const totals = {};
    (world?.activeTasks || []).forEach(task => {
        if (excludeTaskId && task.id === excludeTaskId) return;
        Object.entries(task.reservation || {}).forEach(([stateId, r]) => {
            if (!totals[stateId]) totals[stateId] = { out: 0, in: 0 };
            totals[stateId].out += Number(r.out || 0);
            totals[stateId].in += Number(r.in || 0);
        });
    });
    return totals;
}

function reservationForAlternatives(fulfillmentEffects, expiryEffects) {
    const reservation = {};
    stateDefs.filter(s => s.boundaryMode === 'Strikt').forEach(s => {
        const f = Number(fulfillmentEffects[s.id] || 0);
        const e = Number(expiryEffects[s.id] || 0);
        const out = Math.max(Math.max(0, -f), Math.max(0, -e));
        const inn = Math.max(Math.max(0, f), Math.max(0, e));
        if (out > 0 || inn > 0) reservation[s.id] = { out, in: inn };
    });
    return reservation;
}

function canAddReservation(reservation) {
    const existing = totalReservations();
    for (const [stateId, r] of Object.entries(reservation || {})) {
        const def = stateDef(stateId);
        if (!def || def.boundaryMode !== 'Strikt') continue;
        const cur = Number(world.values[stateId]);
        const prev = existing[stateId] || { out: 0, in: 0 };
        if (cur - def.min - prev.out < Number(r.out || 0) - 1e-9) return false;
        if (def.max - cur - prev.in < Number(r.in || 0) - 1e-9) return false;
    }
    return true;
}

function canApplyTransaction(effects, excludeTaskId = null) {
    const reserved = totalReservations(excludeTaskId);
    for (const [stateId, delta] of Object.entries(effects || {})) {
        const def = stateDef(stateId);
        if (!def) return false;
        if (def.boundaryMode === 'Klemmen') continue;
        const next = Number(world.values[stateId]) + Number(delta);
        const r = reserved[stateId] || { out: 0, in: 0 };
        if (next < def.min - 1e-9 || next > def.max + 1e-9) return false;
        if (next - def.min < r.out - 1e-9) return false;
        if (def.max - next < r.in - 1e-9) return false;
    }
    return true;
}

function applyTransaction(effects, { excludeTaskId = null, clamp = true } = {}) {
    if (!canApplyTransaction(effects, excludeTaskId)) return false;
    const nextValues = { ...world.values };
    Object.entries(effects || {}).forEach(([stateId, delta]) => {
        const def = stateDef(stateId);
        let next = Number(nextValues[stateId]) + Number(delta);
        if (def.boundaryMode === 'Klemmen' && clamp) next = Math.min(def.max, Math.max(def.min, next));
        nextValues[stateId] = next;
    });
    world.values = nextValues;
    return true;
}

function fahrplanLimit() { const n = Number(systemConfig.FahrplanProSession); return Number.isFinite(n) && n > 0 ? Math.floor(n) : 2; }
function fahrplanUsed() { return Math.max(0, Number(world && world.fahrplanUsed) || 0); }
function fahrplanFull() { return fahrplanUsed() >= fahrplanLimit(); }
function fahrplanPips() {
    const lim = fahrplanLimit(), used = Math.min(lim, fahrplanUsed());
    return `<span class="fp" title="Fahrplan: ${lim - used} von ${lim} Aktionen in dieser Session frei"><small>Plan</small>${Array.from({ length: lim }, (_, i) => `<i class="${i < used ? 'used' : ''}"></i>`).join('')}</span>`;
}

function intervalDue(row) {
    return world.session >= row.startOffset && ((world.session - row.startOffset) % row.interval === 0);
}

function runWorldFlows() {
    const eligible = worldFlowList.filter(row => intervalDue(row) && conditionTrue(row.condition, world.values)).sort((a,b) => a.id.localeCompare(b.id));
    eligible.forEach(row => {
        if (!conditionTrue(row.condition, world.values)) return;
        if (!applyTransaction(row.effects)) {
            log(`Weltfluss <b>${row.id}</b> ausgesetzt: Grenzen/Reservierungen lassen die Transaktion nicht zu.`, true);
            return;
        }
        const speaker = personById(pickRuleId(row.personRules, `${row.id}:${world.session}`));
        const counter = personById(pickRuleId(row.counterPersonRules, `${row.id}:G:${world.session}`));
        const prefix = speaker ? `<b>${escapeHtml(speaker.name)}</b>: ` : '';
        const suffix = counter ? ` <small>Gegenstimme: ${escapeHtml(counter.name)}</small>` : '';
        const flavorText = row.flavor ? (/[.!?…“”"]$/.test(row.flavor) ? row.flavor : row.flavor + '.') : row.id + '.';
        log(`${prefix}${escapeHtml(flavorText)}${suffix}`);
        if (row.flavor && speaker && /^MELD_/i.test(row.id)) announce(speaker, flavorText, counter ? `Gegenstimme: ${counter.name}` : '');
    });
}

function runProduction() {
    const eligible = productionList
        .filter(row => intervalDue(row) && conditionTrue(row.condition, world.values))
        .sort((a,b) => (a.priority - b.priority) || a.id.localeCompare(b.id));
    eligible.forEach(row => {
        let runs = 0;
        while (runs < row.maxPerSession) {
            if (!conditionTrue(row.condition, world.values)) break;
            if (!applyTransaction(row.effects)) {
                if (runs === 0) log(`Produktion <b>${row.id}</b> ausgesetzt: Grenzen/Reservierungen.`, true);
                break;
            }
            runs++;
        }
        if (runs > 0) log(`Produktion <b>${row.id}</b> ×${runs}:${escapeHtml(row.flavor || 'ausgeführt')}.`);
    });
}

function runDrift() {
    const reservations = totalReservations();
    stateDefs.forEach(def => {
        if (!def.drift) return;
        const cur = Number(world.values[def.id]);
        if (def.boundaryMode === 'Klemmen') {
            world.values[def.id] = Math.min(def.max, Math.max(def.min, cur + def.drift));
            return;
        }
        const r = reservations[def.id] || { out: 0, in: 0 };
        let allowed = def.drift;
        if (allowed < 0) {
            const floor = def.min + r.out;
            allowed = Math.max(allowed, floor - cur);
        } else {
            const ceil = def.max - r.in;
            allowed = Math.min(allowed, ceil - cur);
        }
        world.values[def.id] = cur + allowed;
    });
}

function expireTasks() {
    const expired = world.activeTasks.filter(t => world.session >= t.createdSession + t.activeDuration);
    expired.forEach(task => {
        const ok = applyTransaction(task.expiryEffects, { excludeTaskId: task.id });
        if (!ok) {
            log(`Ablauf von <b>${task.qId}➔${task.zId}</b> konnte trotz Reservierung nicht gebucht werden. Auftrag bleibt zur Diagnose aktiv.`, true);
            return;
        }
        world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
        unlinkFork(task);
        log(`Auftrag <b>${task.qId}➔${task.zId}</b> abgelaufen${Object.keys(task.expiryEffects).length ? ' – Verfallseffekte gebucht' : ''}.`);
    });
}

function transportQuantity(q, z) {
    if (systemConfig.Transportmenge === 'NurQ') return q.menge;
    throw new Error(`Nicht unterstützte Transportmengen-Regel: ${systemConfig.Transportmenge}`);
}

function scaleTransportEffects(effects, menge) {
    if (systemConfig.EffekteSkalierung === 'ProWaggon') return scaleEffects(effects, menge);
    throw new Error(`Nicht unterstützte Effektskalierung: ${systemConfig.EffekteSkalierung}`);
}

function buildPairSnapshot(q, z) {
    const menge = transportQuantity(q, z);
    const fulfillmentEffects = mergeEffects(scaleTransportEffects(q.sourceEffects, menge), scaleTransportEffects(z.deliveryEffects, menge));
    const expiryEffects = scaleTransportEffects(q.expiryEffects, menge);
    const reservation = reservationForAlternatives(fulfillmentEffects, expiryEffects);
    return { menge, fulfillmentEffects, expiryEffects, reservation };
}

function activeQGroupCount(groupId) {
    return world.activeTasks.filter(t => t.selectionGroup === groupId).length;
}

function activeTargetGroupCount(targetGroup) {
    return world.activeTasks.filter(t => t.targetGroup === targetGroup).length;
}

function isGroupActive(groupId) {
    return activeQGroupCount(groupId) > 0;
}

function isGroupAtCapacity(groupId) {
    return activeQGroupCount(groupId) >= systemConfig.MaxAktivProQGruppe;
}

function isTargetGroupAtCapacity(targetGroup) {
    return activeTargetGroupCount(targetGroup) >= systemConfig.MaxAktivProZielgruppe;
}

function locationBonusForPair(q, z) {
    const places = [...new Set([q.ort, z.ort].filter(Boolean))];
    return places.reduce((sum, place) => sum + Math.max(0, world.session - Number(world.visitTimes[place] || 0)), 0) * systemConfig.OrtAgingProSession;
}

function pairTouchesOverdueLocation(q, z) {
    const threshold = systemConfig.OrtsausgleichAbSessions;
    if (threshold <= 0) return false;
    return [...new Set([q.ort, z.ort].filter(Boolean))].some(place => world.session - Number(world.visitTimes[place] || 0) >= threshold);
}

function buildEligibleCombinations() {
    const zById = Object.fromEntries(zieleList.map(z => [z.id, z]));
    const combos = [];
    quellenList.forEach(q => {
        if (q.triggerType === 'INTERN') return;
        if (world.session < Number(world.groupTimers[q.selectionGroup] ?? q.startOffset)) return;
        if (isGroupAtCapacity(q.selectionGroup)) return;
        if (!conditionTrue(q.condition, world.values)) return;

        q.allowedTargetIds.forEach(zid => {
            const z = zById[zid];
            if (!z || !z.allowedSourceIds.includes(q.id) || z.rohstoff !== q.rohstoff) return;
            if (isTargetGroupAtCapacity(z.targetGroup)) return;
            if (!conditionTrue(z.condition, world.values)) return;
            if (q.triggerType === 'Notfall' && !conditionTrue(z.emergencyCondition, world.values)) return;
            const snapshot = buildPairSnapshot(q, z);
            if (!canAddReservation(snapshot.reservation)) return;
            combos.push({ q, z, ...snapshot, locationBonus: locationBonusForPair(q,z), overdueLocation: pairTouchesOverdueLocation(q,z) });
        });
    });
    return combos;
}

function weightedChoice(items, getWeight) {
    if (!items.length) return null;
    const weights = items.map(item => Math.max(0, Number(getWeight(item) || 0)));
    const total = weights.reduce((a,b) => a+b, 0);
    if (total <= 0) return items[Math.floor(Math.random() * items.length)];
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
        if (r < weights[i]) return items[i];
        r -= weights[i];
    }
    return items[items.length - 1];
}

function classFactor(triggerType) {
    if (triggerType === 'Zufall') return systemConfig.ZufallsGewichtsfaktor;
    if (triggerType === 'Notfall') return systemConfig.NotfallGewichtsfaktor;
    return 1;
}

function restrictCandidatesByPriority(combos, selectionContext) {
    const emergencies = combos.filter(c => c.q.triggerType === 'Notfall');
    if (emergencies.length) return { combos: emergencies, reason: 'Notfall' };
    const randomDue = systemConfig.ZufallsbevorzugungAbSessions > 0 && (world.session - world.lastRandomCreated >= systemConfig.ZufallsbevorzugungAbSessions);
    if (randomDue) {
        const randoms = combos.filter(c => c.q.triggerType === 'Zufall');
        if (randoms.length) return { combos: randoms, reason: 'Zufall' };
    }
    if (!selectionContext.locationPriorityConsumed) {
        const overdue = combos.filter(c => c.overdueLocation);
        if (overdue.length) return { combos: overdue, reason: 'Ortsausgleich' };
    }
    return { combos, reason: 'Frei' };
}

function chooseCombination(combos, selectionContext) {
    const restriction = restrictCandidatesByPriority(combos, selectionContext);
    const restricted = restriction.combos;
    const byGroup = new Map();
    restricted.forEach(c => {
        if (!byGroup.has(c.q.selectionGroup)) byGroup.set(c.q.selectionGroup, []);
        byGroup.get(c.q.selectionGroup).push(c);
    });
    const groups = [...byGroup.entries()].map(([groupId, groupCombos]) => {
        const uniqueQ = [...new Map(groupCombos.map(c => [c.q.id, c.q])).values()];
        const meanQ = uniqueQ.reduce((s,q) => s + q.gewicht, 0) / uniqueQ.length;
        const factor = Math.max(...uniqueQ.map(q => classFactor(q.triggerType)));
        const locBonus = Math.max(...groupCombos.map(c => c.locationBonus), 0);
        return { groupId, combos: groupCombos, weight: meanQ * factor * scenarioFactor(groupId) + Number(world.groupAging[groupId] || 0) + locBonus };
    });
    const chosenGroup = weightedChoice(groups, g => g.weight);
    if (!chosenGroup) return null;

    const byTargetGroup = new Map();
    chosenGroup.combos.forEach(c => {
        if (!byTargetGroup.has(c.z.targetGroup)) byTargetGroup.set(c.z.targetGroup, []);
        byTargetGroup.get(c.z.targetGroup).push(c);
    });
    const targets = [...byTargetGroup.entries()].map(([targetGroup, targetCombos]) => {
        const uniqueZ = [...new Map(targetCombos.map(c => [c.z.id, c.z])).values()];
        const meanZ = uniqueZ.reduce((s,z) => s + z.gewicht, 0) / uniqueZ.length;
        const locBonus = Math.max(...targetCombos.map(c => c.locationBonus), 0);
        return { targetGroup, combos: targetCombos, weight: meanZ + locBonus };
    });
    const chosenTarget = weightedChoice(targets, t => t.weight);
    if (!chosenTarget) return null;
    const combo = weightedChoice(chosenTarget.combos, c => c.q.gewicht * c.z.gewicht);
    return combo ? { combo, priorityReason: restriction.reason } : null;
}

function updateTimerWhenOfferCreated(q) {
    const jitterLimit = systemConfig.CooldownJitter;
    const jitter = jitterLimit > 0 ? randomIntInclusive(-jitterLimit, jitterLimit) : 0;
    const wait = Math.max(1, q.cooldown + jitter);
    world.groupTimers[q.selectionGroup] = world.session + wait;
}

function createTaskFromCombo(combo) {
    if (!canAddReservation(combo.reservation)) return false;
    const q = combo.q, z = combo.z;
    const task = {
        id: `T${world.nextTaskSerial++}`, qId:q.id, zId:z.id, rohstoff:q.rohstoff, menge:combo.menge,
        selectionGroup:q.selectionGroup, targetGroup:z.targetGroup, triggerType:q.triggerType,
        createdSession:world.session, activeDuration:q.activeDuration, expanded:false,
        fulfillmentEffects:combo.fulfillmentEffects, expiryEffects:combo.expiryEffects, reservation:combo.reservation,
        quellePersonId:null, zielPersonId:null, gegenstimmePersonId:null
    };
    assignPersons(task, q, z);
    world.activeTasks.push(task);
    updateTimerWhenOfferCreated(q);
    world.groupAging[q.selectionGroup] = 0;
    if (q.triggerType === 'Zufall') world.lastRandomCreated = world.session;
    log(`Neuer Auftrag <b>${q.id}➔${z.id}</b> (${escapeHtml(q.rohstoff)}).`);
    return true;
}

function selectNewTasks() {
    const selectedGroups = new Set();
    const selectionContext = { locationPriorityConsumed: false };
    let created = 0;
    while (world.activeTasks.length < systemConfig.MaxAktiveAuftraege && created < systemConfig.MaxNeueAuftraegeProSession) {
        const combos = buildEligibleCombinations();
        if (!combos.length) break;
        const chosen = chooseCombination(combos, selectionContext);
        if (!chosen) break;
        const before = world.activeTasks.length;
        if (!createTaskFromCombo(chosen.combo)) break;
        if (chosen.priorityReason === 'Ortsausgleich') selectionContext.locationPriorityConsumed = true;
        selectedGroups.add(chosen.combo.q.selectionGroup);
        created++;
        if (gabelungList.length) {
            tryFork(world.activeTasks[world.activeTasks.length - 1]);
            world.activeTasks.slice(before + 1).forEach(t => { selectedGroups.add(t.selectionGroup); created++; });
        }
    }

    const finalCombos = buildEligibleCombinations();
    const eligibleGroups = new Set(finalCombos.map(c => c.q.selectionGroup));
    const allGroups = new Set(quellenList.filter(q => q.triggerType !== 'INTERN').map(q => q.selectionGroup));
    allGroups.forEach(groupId => {
        if (selectedGroups.has(groupId) || isGroupActive(groupId)) {
            world.groupAging[groupId] = 0;
        } else if (eligibleGroups.has(groupId)) {
            world.groupAging[groupId] = Number(world.groupAging[groupId] || 0) + systemConfig.AgingProSession;
        } else {
            world.groupAging[groupId] = 0;
        }
    });
}

function runSessionPhases({ includeExpiry = true } = {}) {
    if (includeExpiry) expireTasks();
    runWorldFlows();
    runProduction();
    runDrift();
    runKassensturz();
    selectNewTasks();
}

function qById(id) { return quellenList.find(q => q.id === id); }
function zById(id) { return zieleList.find(z => z.id === id); }
function personById(id) { return personsList.find(p => p.id === id) || null; }

function nextRound() {
    if (!simulationReady || popupBusy) return;
    world.session += 1;
    world.fahrplanUsed = 0;
    log(`--- Session ${world.session} gestartet ---`);
    try {
        runSessionPhases({ includeExpiry: true });
        saveWorld();
        render();
    } catch (err) {
        console.error(err);
        showFatal(`Simulationsfehler: ${err.message}`);
    }
}

function manualReset() {
    if (!quellenList.length || !zieleList.length || !stateDefs.length) return;
    const ok = confirm('Kompletten Neustart durchführen? Zustände, aktive Aufträge, Timer, Aging und Besuchszeiten werden neu initialisiert.');
    if (!ok) return;
    world = initialWorld();
    clearLog();
    log('Kompletter Neustart durchgeführt.');
    runSessionPhases({ includeExpiry: false });
    saveWorld();
    simulationReady = true;
    render();
    announceScenario();
}

// Kein Markieren von Auftragstext (mobile Browser ignorieren user-select teils bei Buttons)
['selectstart', 'contextmenu', 'dragstart'].forEach(ev => document.addEventListener(ev, e => {
    const n = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);
    if (n && n.closest && n.closest('.task-item')) e.preventDefault();
}, true));
document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.task-item')) { const sel = getSelection && getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges(); }
}, true);

function toggleTaskCollapse(taskId) {
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;
    task.expanded = !task.expanded;
    saveWorld();
    render();
    const first = task.expanded && !task.tuned;
    if (first) { task.tuned = true; saveWorld(); }
    if (task.expanded) requestAnimationFrame(() => { scrollTaskToTop(taskId); if (first) tuneIn(taskId); });
}

function tuneIn(id) {
    const el = document.querySelector(`[data-task="${id}"]`), f = el && el.querySelector('.freq');
    if (!el || !f) return;
    const target = f.textContent.replace(/[^\d.]/g, ''), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const d = document.createElement('div'); d.className = 'dial';
    d.innerHTML = '<div class="d-freq">VHF <b style="font-weight:400">150.000</b></div><div class="d-wheel"></div>';
    el.appendChild(d);
    const out = d.querySelector('b'), steps = 8; let i = 0, v = 150 + Math.random() * 2;
    const tick = () => {
        i++; v += (Number(target) - v) / (steps - i + 1) + (i < steps ? 0.15 : 0);
        out.textContent = i >= steps ? target : v.toFixed(3);
        if (i >= steps) { setTimeout(() => d.classList.add('out'), reduce ? 100 : 200); setTimeout(() => d.remove(), reduce ? 400 : 520); return; }
        setTimeout(tick, 55 + i * 9);
    };
    tick();
}

function scrollTaskToTop(taskId) {
    const sa = document.querySelector('.scroll-area'), box = document.getElementById('task-container');
    const el = box && box.querySelector(`[data-task="${taskId}"]`);
    if (!sa || !el) return;
    // Platz am Listenende auffüllen, damit auch die letzte Karte ganz nach oben scrollen kann
    const need = sa.clientHeight - (box.getBoundingClientRect().bottom - el.getBoundingClientRect().top) - 14;
    if (need > 0) box.style.paddingBottom = need + 'px';
    const top = sa.scrollTop + el.getBoundingClientRect().top - sa.getBoundingClientRect().top - 12;
    sa.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}

function completeTask(taskId) {
    if (popupBusy) return;
    if (fahrplanFull()) { render(); return; }
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;
    const q = qById(task.qId);
    const z = zById(task.zId);
    if (!q || !z) return;

    const ok = applyTransaction(task.fulfillmentEffects, { excludeTaskId: task.id });
    if (!ok) {
        log(`Erfüllung <b>${task.qId}➔${task.zId}</b> blockiert: Reservierungs-/Grenzverletzung.`, true);
        render();
        return;
    }
    world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
    resolveFork(task);
    [...new Set([q.ort, z.ort].filter(Boolean))].forEach(place => world.visitTimes[place] = world.session);
    log(`Transport <b>${task.qId}➔${task.zId}</b> erfüllt; Effekte atomar gebucht.`);
    world.fahrplanUsed = fahrplanUsed() + 1;
    saveWorld();
    render();

    popupBusy = true;
    showPersonPopup(task, true, () => {
        popupBusy = false;
        render();
    });
}

function ignoreTask(taskId) {
    if (popupBusy) return;
    if (fahrplanFull()) { render(); return; }
    const task = world.activeTasks.find(t => t.id === taskId);
    if (!task) return;

    const ok = applyTransaction(task.expiryEffects, { excludeTaskId: task.id });
    if (!ok) {
        log(`Ablehnung <b>${task.qId}➔${task.zId}</b> blockiert: Reservierungs-/Grenzverletzung.`, true);
        render();
        return;
    }
    world.activeTasks = world.activeTasks.filter(t => t.id !== task.id);
    unlinkFork(task);
    log(`Auftrag <b>${task.qId}➔${task.zId}</b> abgelehnt; Verfallseffekte wie beim Ablauf gebucht.`);
    world.fahrplanUsed = fahrplanUsed() + 1;
    saveWorld();
    render();

    popupBusy = true;
    showPersonPopup(task, false, () => {
        popupBusy = false;
        triggerRejectionGlitch();
        render();
    });
}

function extractImgUrl(html) {
    if (!html) return '';
    const m = String(html).match(/src=["']([^"']+)["']/i);
    return m ? m[1] : '';
}

function normalizePersonData(raw) {
    let bildUrl = cleanCell(getField(raw, 'Bild_URL', 'Bild-URL', 'Bild URL', 'BildURL'));
    if (!bildUrl) bildUrl = extractImgUrl(getField(raw, 'Bild'));
    if (bildUrl.includes(' ')) bildUrl = bildUrl.split(/\s+/)[0];
    return {
        id: cleanCell(getField(raw, 'ID')),
        funktion: cleanCell(getField(raw, 'Funktion')),
        name: cleanCell(getField(raw, 'Name')),
        eigenschaften: cleanCell(getField(raw, 'Eigenschaften')),
        hierarchie: cleanCell(getField(raw, 'Hierarchiestufe')),
        ort: cleanCell(getField(raw, 'Ort')),
        bildUrl,
        antwortErfuellt: cleanCell(getField(raw, 'Antwort erfüllt', 'Antwort_erfüllt', 'AntwortErfüllt', 'Antwort erfuellt')),
        antwortAbgelehnt: cleanCell(getField(raw, 'Antwort abgelehnt', 'Antwort_abgelehnt', 'AntwortAbgelehnt'))
    };
}

function pickRuleId(rules, key, exclude = []) {
    const valid = (rules || []).filter(r => personById(r.id) && !exclude.includes(r.id));
    const matching = valid.filter(r => r.condition?.raw && conditionTrue(r.condition, world.values));
    const pool = matching.length ? matching : valid.filter(r => !r.condition?.raw);
    return pool.length ? pool[parseInt(stableHash(String(key)), 16) % pool.length].id : null;
}

function pickMainPerson(q, z, key) {
    const qCond = (q.personRules || []).filter(r => r.condition?.raw && conditionTrue(r.condition, world.values));
    const zCond = (z.personRules || []).filter(r => r.condition?.raw && conditionTrue(r.condition, world.values));
    const conditional = [...qCond.map(r => ({...r, side:'Q'})), ...zCond.map(r => ({...r, side:'Z'}))].filter(r => personById(r.id));
    if (conditional.length) return conditional[parseInt(stableHash(`${key}:C`), 16) % conditional.length];
    const qBase = (q.personRules || []).filter(r => !r.condition?.raw && personById(r.id));
    if (qBase.length) return {...qBase[parseInt(stableHash(`${key}:Q`), 16) % qBase.length], side:'Q'};
    const zBase = (z.personRules || []).filter(r => !r.condition?.raw && personById(r.id));
    if (zBase.length) return {...zBase[parseInt(stableHash(`${key}:Z`), 16) % zBase.length], side:'Z'};

function guessedCargoSymbol(name) {
    const s = String(name || '').toLowerCase();
    if (/fisch|fang/.test(s)) return 'fish';
    if (/wasser/.test(s)) return 'water';
    if (/diesel/.test(s)) return 'fuel';
    if (/holz/.test(s)) return 'wood';
    if (/abfall/.test(s)) return 'waste';
    if (/sonder|säure|aceton|ammoniak|ephedrin|meth/.test(s)) return 'hazard';
    if (/kokos/.test(s)) return /öl/.test(s) ? 'oil' : 'coconut';
    if (/munition/.test(s)) return 'ammo';
    if (/befehl|bericht|kurier/.test(s)) return 'document';
    if (/schutzgeld|sold/.test(s)) return 'money';
    if (/ersatz|sabotage/.test(s)) return 'tools';
    if (/havarie|versorgung/.test(s)) return 'medical';
    if (/prise/.test(s)) return 'ship';
    return 'crate';
}

function fxBurst(ok) {
    const cols = ok ? ['#34d399', '#fbbf24', '#38bdf8', '#ffffff'] : ['#f87171', '#64748b', '#94a3b8'];
    const n = ok ? 20 : 12, r = Math.random;
    return Array.from({ length: n }, (_, i) => {
        const a = (i / n) * 6.283 + r() * 0.3, d = 70 + r() * 70;
        const dx = ok ? Math.cos(a) * d : (r() - 0.5) * 150, dy = ok ? Math.sin(a) * d : 40 + r() * 130;
        return `<i style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--r:${(r() * 720 - 360).toFixed(0)}deg;background:${cols[i % cols.length]};animation-delay:${((ok ? 0.3 : 0.5) + r() * 0.12).toFixed(2)}s"></i>`;
    }).join('');
}

function stateIcon(s) {
    const t = `${s.id} ${s.typ} ${s.ort} ${s.description}`.toLowerCase();
    const map = [
        [/wasser|brunnen|fluss|regen/, '💧'], [/kohle|erz|mine|stein/, '⛏️'], [/holz|wald|forst|säge/, '🪵'],
        [/öl|oel|treibstoff|diesel/, '🛢️'], [/dampf|kessel|druck/, '♨️'], [/strom|energie|elektr/, '⚡'],
        [/geld|kasse|budget|kapital|gewinn|münz/, '💰'], [/fisch|fang/, '🐟'], [/nahrung|essen|vorrat|lebensmittel|reis/, '🌾'],
        [/personal|arbeit|crew|mannschaft|bevölker/, '👷'], [/ruf|stimmung|moral|vertrauen|zufriedenheit/, '🤝'],
        [/lager|bestand|fracht|ladung/, '📦'], [/zug|lok|schiene|gleis|bahn/, '🚂'], [/wartung|zustand|verschleiß|reparatur/, '🔧']
    ];
    for (const [re, ic] of map) if (re.test(t)) return ic;
    return '◆';

function stateInfo(s, reserved) {
    const val = Number(world.values[s.id]);
    const range = (s.max - s.min) || 1;
    const pct = v => Math.max(0, Math.min(100, ((v - s.min) / range) * 100));
    const p = pct(val);
    const level = (p <= 8 || p >= 98) ? 'crit' : (p <= 25 || p >= 90) ? 'warn' : '';
    const r = reserved[s.id] || {};
    return { val, p, level, out: Number(r.out || 0), inn: Number(r.in || 0), pct };
}

function taskImpact() {
    const m = {};
    world.activeTasks.forEach(t => [['f', t.fulfillmentEffects], ['x', t.expiryEffects]].forEach(([k, eff]) =>
        Object.entries(eff || {}).forEach(([id, d]) => { (m[id] = m[id] || { f: 0, x: 0 })[k] += Number(d); })));
    return m;
}
const fmtD = d => (d > 0 ? '+' : '−') + formatStateValue(Math.abs(d));
function impactTags(imp) {
    if (!imp) return '';
    return (imp.f ? `<span class="imp ${imp.f > 0 ? 'up' : 'dn'}">✓${fmtD(imp.f)}</span>` : '') +
           (imp.x ? `<span class="imp ${imp.x > 0 ? 'up' : 'dn'}">✕${fmtD(imp.x)}</span>` : '');
}

function renderStatusBox() {
    const panel = document.getElementById('state-panel');
    if (!panel || !world) return;
    const defs = stateDefs.filter(s => s.display);
    if (!defs.length) { panel.style.display = 'none'; return; }
    panel.style.display = '';
    const reserved = totalReservations(), imp = taskImpact();
    const w = s => imp[s.id] ? Math.abs(imp[s.id].f) + Math.abs(imp[s.id].x) : 0;
    const visible = defs.map((s, i) => ({ s, i })).sort((a, b) => (w(b.s) > 0) - (w(a.s) > 0) || w(b.s) - w(a.s) || a.i - b.i).map(o => o.s);
    const hit = visible.filter(s => imp[s.id]).length;
    const label = s => escapeHtml(s.description || s.typ || s.id);
    const color = i => i.level === 'crit' ? '#f87171' : i.level === 'warn' ? '#fbbf24' : '#38bdf8';

    const shownAll = visible.filter(s => imp[s.id] || stateInfo(s, reserved).level);
    const lvl = s => ({ crit: 2, warn: 1 }[stateInfo(s, reserved).level] || 0);
    const shown = shownAll.map((s, i) => ({ s, i })).sort((a, b) => lvl(b.s) - lvl(a.s) || a.i - b.i).slice(0, 4).map(o => o.s);
    const rest = visible.length - shown.length;
    const strip = shown.map(s => {
        const i = stateInfo(s, reserved);
        return `<div class="chip" title="${escapeAttr(s.description || s.id)}" style="--c:${color(i)}">
            <div class="chip-top"><span>${stateIcon(s)}</span><b>${formatStateValue(i.val)}</b></div>
            <div class="chip-name">${escapeHtml(stateLabel(s.id))}</div>
            <div class="gauge"><div class="fill" style="width:${i.p}%"></div></div>
            <div class="chip-imp">${impactTags(imp[s.id]) || ''}</div></div>`;
    }).join('') + (rest ? `<div class="chip more" onclick="toggleStatePanel()">+${rest}<small>ruhig</small></div>` : '') + (!shown.length && !rest ? '' : '');

    let body = '';
    if (statePanelOpen) {
        const groups = new Map();
        visible.forEach(s => { const k = s.ort || 'Allgemein'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
        body = `<div class="state-groups">` + [...groups.entries()].map(([ort, list]) => {
            const tiles = list.map(s => {
                const i = stateInfo(s, reserved);
                const outL = i.pct(i.val - i.out), inW = i.inn ? i.pct(i.val + i.inn) - i.p : 0;
                const tags = [
                    `<span class="tag id">${escapeHtml(s.id)}</span>`, impactTags(imp[s.id]),
                    i.out ? `<span class="tag out">▼ −${formatStateValue(i.out)} reserviert</span>` : '',
                    i.inn ? `<span class="tag in">▲ +${formatStateValue(i.inn)} erwartet</span>` : '',
                    s.drift ? `<span class="tag">${s.drift > 0 ? '↗ +' : '↘ '}${formatStateValue(s.drift)}/Session</span>` : ''
                ].join('');
                return `<div class="state-tile ${i.level}${imp[s.id] ? '' : ' idle'}" title="${escapeAttr(s.description || s.id)}">
                    <div class="st-top"><span class="st-icon">${stateIcon(s)}</span><span class="st-name">${escapeHtml(stateLabel(s.id))}</span></div>
                    <div class="st-desc">${label(s)}</div>
                    <div class="st-val">${formatStateValue(i.val)}<small>/ ${formatStateValue(s.max)}</small></div>
                    <div class="gauge"><div class="fill" style="width:${i.p}%"></div>
                        ${i.out ? `<div class="res out" style="left:${outL}%;width:${Math.max(0, i.p - outL)}%"></div>` : ''}
                        ${i.inn ? `<div class="res in" style="left:${i.p}%;width:${Math.max(0, inW)}%"></div>` : ''}</div>
                    <div class="st-meta">${tags}</div></div>`;
            }).join('');
            return `<div><div class="state-group-title">${escapeHtml(ort)}</div><div class="state-grid">${tiles}</div></div>`;
        }).join('') + `</div>`;
    }

    panel.innerHTML = `<div class="state-head" onclick="toggleStatePanel()">
            <div class="state-head-title"><i>▣</i> Betriebslage <small>${hit ? hit + ' betroffen' : 'ruhig'}</small></div>
            <div class="state-toggle">${statePanelOpen ? 'Weniger ▴' : 'Details ▾'}</div></div>
        ${statePanelOpen ? '' : `<div class="state-strip">${strip}</div>`}
        ${hit ? '<div class="state-legend">✓ bei Ausführen · ✕ bei Ablehnen/Ablauf</div>' : ''}${body}`;
}

    const parts = [];
    if (sc) parts.push(`<span class="sc">🌴 ${escapeHtml(sc.name)}</span>`);
    if (k) parts.push(`<span class="ks">⏱ Kassensturz ${left ? `in <b>${left}</b>` : '<b>jetzt</b>'}${near ? ' ' + st.map(x => `<span class="${x.ok ? 'ok' : 'no'}">${x.ok ? '✓' : '✕'}</span>`).join('') : ''}</span>`);
    const chips = [`<span class="mchip one" onclick="toggleMeta()">${parts.join('<i class="sep"></i>')}</span>`];
    let detail = '';
    if (metaOpen) {
        detail = `<div class="meta-detail">` +
            (sc ? `<div><div class="md-title">Szenario: ${escapeHtml(sc.name)}</div>${escapeHtml(sc.beschreibung)}</div>` : '') +
            (k ? `<div><div class="md-title">Kassensturz in Session ${k.day}${hist.length ? ` <small>(bisher ${won}/${hist.length} bestanden)</small>` : ''}</div>` + st.map(({ row, ok }) => {
                const pr = personById(row.pruefer);
                return `<div class="k-row ${row.pruefer.toLowerCase()}"><div class="k-who">${escapeHtml(pr ? pr.name : row.pruefer)}: ${escapeHtml(row.titel)} <span class="${ok ? 'ok' : 'no'}" style="color:${ok ? '#6ee7b7' : '#fca5a5'}">${ok ? '✓ aktuell erfüllt' : '✕ aktuell nicht erfüllt'}</span></div>
                    ${row.announceText ? `<div class="k-quote">${escapeHtml(row.announceText)}</div>` : ''}
                    <div class="k-eff">Bestanden: ${effTags(row.reward) || '–'}</div><div class="k-eff">Verfehlt: ${effTags(row.penalty) || '–'}</div></div>`;
            }).join('') + `</div>` : '') + `</div>`;
    }
    el.innerHTML = `<div class="meta-row">${chips.join('')}</div>${detail}`;
}

function render() {
    if (!world) return;
    renderMeta();
    document.getElementById('round-display').innerHTML = `Session: ${world.session}${fahrplanPips()}`;
    const container = document.getElementById('task-container');
    container.innerHTML = '';
    container.style.paddingBottom = '';
    if (!world.activeTasks.length) {
        container.innerHTML = '<div class="status-msg">Keine aktiven Transportaufträge. Weiter mit „Weiter funken“.</div>';
        renderStatusBox(); return;
    }

    world.activeTasks.forEach(task => {
        const q = qById(task.qId), z = zById(task.zId);
        if (!q || !z) return;
        const freq = radioFrequency(task.id);
        const remaining = Math.max(0, task.activeDuration - (world.session - task.createdSession));
        const full = fahrplanFull();
        const sigLabel = q.triggerType === 'Notfall' ? 'NOTFALL' : (remaining <= 1 ? 'LETZTE CHANCE' : (full ? 'VERTAGT' : ''));
        const isEskalation = q.triggerType === 'Notfall' || (task.activeDuration - (world.session - task.createdSession)) <= 1;
        const urgencyClass = isEskalation ? 'urgency-high' : (q.triggerType === 'Zufall' ? 'urgency-med' : 'urgency-low');
        const taskEl = document.createElement('div');
        taskEl.dataset.task = task.id;

        if (!task.expanded) {
            taskEl.className = `task-item collapsed ${urgencyClass}${full ? ' vertagt' : ''}`;
            taskEl.onclick = () => toggleTaskCollapse(task.id);
            taskEl.innerHTML = `<div class="c-row"><span class="c-ic">${cargoSvg(task.rohstoff)}</span>
                <div class="c-main"><div class="c-title">${escapeHtml(task.rohstoff)}${task.menge > 1 ? ' ×' + task.menge : ''}${task.forkId ? '<span class="c-fork" title="Gabelung">⚔</span>' : ''}</div>
                <div class="c-route">${escapeHtml(q.ort)} → ${escapeHtml(z.ort)}</div></div>
                <div class="radio-signal">${sigLabel}${pipsHtml(task, remaining)}</div></div>`;
        } else {
            const sourcePerson = personById(task.quellePersonId), targetPerson = personById(task.zielPersonId), counter = personById(task.gegenstimmePersonId);
            const quoteHtml = (person, text) => {
                if (!person || !text) return '';
                return `<button type="button" class="quote${text.length > 95 ? ' long' : ''}" onclick="this.classList.toggle('open')"><span>${escapeHtml(text)}</span></button>`;
            };
            const units = Array.from({length:Math.max(1, Number(task.menge) || 1)}, () => cargoSvg(task.rohstoff)).join('');
            const counterHtml = counter ? `<button type="button" class="counter-voice" onclick="this.classList.toggle('open')"><span><b>GEGENSTIMME · ${escapeHtml(counter.name)}</b> · ${escapeHtml(counter.funktion || '')} – lehnt diesen Transport ab.</span></button>` : '';
            const place = (cls, person, row, flavor, extra = '') => `<div class="loc-block compact${cls}">${renderPersonBlock(person)}<div class="loc-info">
                    <div class="loc-head"><span class="loc-name">${escapeHtml(row.ort)}</span><span class="loc-label">${escapeHtml(row.detail)}</span>${extra}</div>
                    <div class="loc-reason">${escapeHtml(row.grund)}</div>${quoteHtml(person, flavor)}</div></div>`;
            const forkRule = task.forkId ? gabelungList.find(g => g.id === task.forkRule) : null;
            const partner = task.forkId ? world.activeTasks.find(t => t.id === task.forkId) : null;
            const forkHtml = partner ? `<div class="fork-note">⚔ <b>Gabelung${forkRule && forkRule.titel ? ' · ' + escapeHtml(forkRule.titel) : ''}:</b> Wer diesen Transport ausführt, lässt <b>${escapeHtml(partner.rohstoff)}</b> (${escapeHtml((qById(partner.qId) || {}).ort || '?')} → ${escapeHtml((zById(partner.zId) || {}).ort || '?')}) verfallen.${forkRule && forkRule.flavor ? ' ' + escapeHtml(forkRule.flavor) : ''}</div>` : '';
            const actions = full
                ? `<div class="vertagt-note">Fahrplan voll – ${remaining <= 1 ? 'dieser Auftrag verfällt mit der nächsten Session.' : 'dieser Auftrag wird vertagt.'}</div>`
                : `<div class="task-actions">
                    <button class="btn-task btn-done" onclick="completeTask('${escapeAttr(task.id)}')">Transport ausführen</button>
                    <button class="btn-task btn-ignore" onclick="ignoreTask('${escapeAttr(task.id)}')">Nicht erfüllen</button>
                </div>`;

            taskEl.className = `task-item ${urgencyClass}`;
            taskEl.onclick = e => { if (!e.target.closest('button,.dial')) toggleTaskCollapse(task.id); };
            const freqTag = '';
            taskEl.innerHTML = `<span class="freq">▲ VHF ${freq}</span>${place('', sourcePerson, q, q.flavorText)}
                <div class="cargo-strip" title="Einklappen">${cargoSvg(task.rohstoff)}<span class="cargo-name">${escapeHtml(task.rohstoff)}</span><span class="cargo-units">${units}</span><span class="cargo-time">${sigLabel ? `<b>${sigLabel}</b>` : ''}noch ${remaining} Session${remaining === 1 ? '' : 's'}</span></div>
                ${place(' demand', targetPerson, z, z.flavorText)}
                ${counterHtml}
                ${forkHtml}
                ${actions}`;
        }
        container.appendChild(taskEl);
    });
    renderStatusBox();
}

function validatePersonReferences() {
    if (!personsList.length) return;
    const known = new Set(personsList.map(p => p.id.toUpperCase()));
    const missing = new Set();
    [...quellenList, ...zieleList, ...worldFlowList].forEach(row => [...(row.personRules || []), ...(row.counterPersonRules || [])].forEach(r => { if (!known.has(r.id)) missing.add(r.id); }));
    if (missing.size) throw new Error(`Unbekannte Personen-IDs: ${[...missing].join(', ')}`);
}

function preloadPersonZooms(list) {
    (list || []).forEach(p => { if (!personZoomCache[p.id]) personZoomCache[p.id] = { size: 'cover', pos: 'center 15%', scaleNum: 1.15 }; });
}

async function loadOptionalUiData() {
    try {
        const aRaw = await fetchSheetJSONP('Abgelehnt');
        abgelehntWords = aRaw.map(r => ({ wort:cleanCell(getField(r,'Wort')), kategorie:cleanCell(getField(r,'Kategorie')) })).filter(w => w.wort);
    } catch (err) { console.warn('Abgelehnt nicht geladen:', err); }
    try {
        const pRaw = await fetchSheetJSONP('Personen');
        personsList = pRaw.map(normalizePersonData).filter(p => p.id);
        preloadPersonZooms(personsList);
        validatePersonReferences();
    } catch (err) { console.warn('Personen nicht geladen:', err); }
    try {
        const sRaw = await fetchSheetJSONP('SYMBOLE').catch(() => fetchSheetJSONP('Symbole'));
        cargoSymbolMap = Object.fromEntries(sRaw.map(r => [cleanCell(getField(r,'Rohstoff')), cleanCell(getField(r,'Symbol')).toLowerCase()]).filter(([r,k]) => r && CARGO_ICONS[k]));
    } catch (err) { console.warn('SYMBOLE nicht geladen – automatische Icons aktiv:', err); }
}

async function initData() {
    try {
        const names = ['Quellen','Ziele','ZUSTAENDE','PRODUKTION','WELTFLUESSE','SYSTEM'];
        const loaded = await Promise.all(names.map(name => fetchSheetJSONP(name).then(rows => [name, rows])));
        const sheets = Object.fromEntries(loaded);
        normalizeData(sheets);
        const extra = {};
        for (const n of ['SZENARIEN', 'KASSENSTURZ', 'GABELUNGEN']) extra[n] = await fetchSheetJSONP(n).catch(() => []);
        normalizeExtras(extra);
        datasetSignature = makeDatasetSignature();
        await loadOptionalUiData();
        if (!loadWorldOrInitialize()) return;
        simulationReady = true;
        log(`Schema ${escapeHtml(systemConfig.SchemaVersion)} geladen: ${quellenList.length} Quellen, ${zieleList.length} Ziele, ${stateDefs.length} Zustände, ${productionList.length} Produktionsprozesse, ${worldFlowList.length} Weltflüsse.`);
        render();
        announceScenario();
    } catch (err) {
        console.error(err);
        showFatal(err.message || String(err));
    }
}

window.onload = initData;
</script>
